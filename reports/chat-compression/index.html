* { box-sizing: border-box; }

<script type="application/json" id="aa-data">{"meta": {"question": "How does Gemini CLI compress chat history when the context fills up?", "title": "Chat compression", "slug": "chat-compression", "analysed_at": "2026-10-03", "hook": "At 50% of the window it keeps the newest 30% and turns the rest into a snapshot the model then critiques.", "site_url": "https://antriksh29071989.github.io/agent-anatomy/reports/chat-compression/"}, "answer": "When the prompt reaches 50% of the model's token limit, Gemini CLI keeps roughly the newest 30% of the conversation and replaces the older part with a structured `<state_snapshot>` written by a model. It makes two model calls: one to write the snapshot and one asking the model to critique and improve it. If the result is not smaller than before, it is thrown away and later automatic attempts fall back to truncating old tool outputs only.", "repos": [{"id": "gemini-cli", "repo": "google-gemini/gemini-cli", "commit": "fb972b2f87fe7d5b06d37eac711490162d98de2c", "commit_date": "2026-10-02", "kind": "product", "language": "TypeScript", "license": "Apache-2.0", "what": "Google's terminal coding agent", "verdict": "implements", "summary": "A `ChatCompressionService` that runs before every turn: a threshold check, a budget pass over old tool outputs, a split at a safe message boundary, a model-written state snapshot with a self-critique pass, and a guard that rejects a result that came out larger.", "url": "https://github.com/google-gemini/gemini-cli"}], "comparison": {"dimensions": ["Trigger", "What is kept", "What is summarised", "How", "If it fails"], "rows": [{"repo": "gemini-cli", "cells": ["Prompt tokens reach 50% of the model's limit (`DEFAULT_COMPRESSION_TOKEN_THRESHOLD`, configurable), or the user runs the compress command", "About the newest 30% of the history, cut at a user message that is not a tool response. Old tool outputs beyond a 50,000-token budget are cut to their last 30 lines", "Everything before the split point, about 70%", "Two model calls: write a `<state_snapshot>` in XML, then critique and rewrite it. The snapshot is inserted as a user message followed by a fixed model acknowledgement", "Empty summary: nothing changes. Result larger than before: discarded, and later automatic attempts only truncate tool outputs without calling the summariser"]}]}, "deep_dives": [{"repo": "gemini-cli", "headline": "Truncate, split, snapshot, verify, and reject if it grew", "how_it_works": ["`GeminiClient` calls `tryCompressChat` at the start of every turn, before the model is called. The service first decides whether to act at all: it takes the token count of the last prompt and compares it with the threshold times the model's token limit. The default threshold is 0.5, so compression starts at half the context window, not at the edge. A user-run compress command sets `force` and skips this check.", "Before summarising anything, it makes a cheap pass called `truncateHistoryToBudget`. Walking from newest to oldest, it lets tool responses use up to 50,000 tokens in full. Older large tool responses past that budget are cut to their last 30 lines and the full output is saved to a file.", "Then it picks the split point. `findCompressSplitPoint` measures each message by its JSON length and looks for the first position, after 70% of the characters, that is a user message which is not a tool response. Splitting only there means a tool call is never separated from its result. If no such point exists, it compresses everything, but only when the last message is a model message with no pending tool call.", "The older part is sent to a model with a dedicated system prompt that asks for a `<state_snapshot>` with fixed sections: overall goal, active constraints, key knowledge, artifact trail, file system state, recent actions and task state. If an earlier snapshot is already in the history, the instruction is to merge it into the new one. A second call then hands the model its own snapshot and asks it to critically evaluate what it left out and produce an improved version.", "The new history is the snapshot as a user message, a fixed model reply, and the kept recent turns. The service counts the tokens of that new history. If the count is higher than before, the result is discarded and the client sets a flag: from then on, automatic attempts skip the summariser and rely on tool-output truncation alone. On success, the client starts a fresh chat session with the new history and emits a `ChatCompressed` event."], "diagram": {"caption": "Two exits return the history unchanged; one failure switches later attempts to truncation only.", "mermaid": "flowchart TB\n  turn[\"Start of a turn<br/>tryCompressChat\"]:::external --> chk{\"Tokens at or above<br/>50 percent of limit?\"}:::component\n  chk -->|\"no\"| noop[\"No change\"]:::store\n  chk -->|\"yes, or forced\"| trunc[\"truncateHistoryToBudget<br/>trim old tool outputs\"]:::component\n  trunc --> failed{\"Summariser failed<br/>earlier?\"}:::component\n  failed -->|\"yes\"| tonly[\"Keep truncation only<br/>CONTENT_TRUNCATED\"]:::store\n  failed -->|\"no\"| split[\"findCompressSplitPoint<br/>keep newest 30 percent\"]:::component\n  split --> snap[\"Model writes<br/>state_snapshot\"]:::system\n  snap --> verify[\"Model critiques<br/>and rewrites it\"]:::system\n  verify --> count{\"New history<br/>smaller?\"}:::component\n  count -->|\"yes\"| done[\"New chat session<br/>COMPRESSED\"]:::store\n  count -->|\"no\"| flag[\"Discard result<br/>set failure flag\"]:::queue\n"}, "key_parts": [{"name": "ChatCompressionService.compress", "path": "packages/core/src/context/chatCompressionService.ts", "role": "The whole procedure: threshold check, truncation, split, two model calls, size guard", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "DEFAULT_COMPRESSION_TOKEN_THRESHOLD", "path": "packages/core/src/context/chatCompressionService.ts", "role": "0.5: the fraction of the model's token limit at which compression starts", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "COMPRESSION_PRESERVE_THRESHOLD", "path": "packages/core/src/context/chatCompressionService.ts", "role": "0.3: the fraction of recent history kept verbatim", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "COMPRESSION_FUNCTION_RESPONSE_TOKEN_BUDGET", "path": "packages/core/src/context/chatCompressionService.ts", "role": "50,000 tokens of tool responses kept in full before older ones are truncated", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "findCompressSplitPoint", "path": "packages/core/src/context/chatCompressionService.ts", "role": "Chooses a cut that never separates a tool call from its response", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "getCompressionPrompt", "path": "packages/core/src/prompts/snippets.ts", "role": "The summariser's system prompt and the snapshot's XML structure", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/prompts/snippets.ts"}, {"name": "GeminiClient.tryCompressChat", "path": "packages/core/src/core/client.ts", "role": "Calls the service each turn, applies the result and remembers a failed attempt", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts"}, {"name": "compressCommand", "path": "packages/cli/src/ui/commands/compressCommand.ts", "role": "The manual command, which calls `tryCo ontent) => JSON.stringify(content).length);\n  const totalCharCount = charCounts.reduce((a, b) => a + b, 0);\n  const targetCharCount = totalCharCount * fraction;\n\n  let lastSplitPoint = 0; // 0 is always valid (compress nothing)\n  let cumulativeCharCount = 0;\n  for (let i = 0; i < contents.length; i++) {\n    const content = contents[i];\n    if (\n      content.role === 'user' &&\n      !content.parts?.some((part) => !!part.functionResponse)\n    ) {\n      if (cumulativeCharCount >= targetCharCount) {\n        return i;\n      }\n      lastSplitPoint = i;\n    }\n    cumulativeCharCount += charCounts[i];\n  }\n\n  // We found no split points after targetCharCount.\n  // Check if it's safe to compress everything.\n  const lastContent = contents[contents.length - 1];\n  if (\n    lastContent?.role === 'model' &&\n    !lastContent?.parts?.some((part) => part.functionCall)\n  ) {\n    return contents.length;\n  }\n\n  // Can't compress everything so just compress at last splitpoint.\n  return lastSplitPoint;\n}", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L282-L322"}, {"path": "packages/core/src/context/chatCompressionService.ts", "start": 587, "end": 613, "expect": "state_snapshot", "title": "First call: write the snapshot", "note": "If a snapshot from an earlier compression is present, the model is told to fold it into the new one.", "code": "    const hasPreviousSnapshot = historyForSummarizer.some((c) =>\n      c.parts?.some((p) => p.text?.includes('<state_snapshot>')),\n    );\n\n    const anchorInstruction = hasPreviousSnapshot\n      ? 'A previous <state_snapshot> exists in the history. You MUST integrate all still-relevant information from that snapshot into the new one, updating it with the more recent events. Do not lose established constraints or critical knowledge.'\n      : 'Generate a new <state_snapshot> based on the provided history.';\n\n    const summaryResponse = await config.getBaseLlmClient().generateContent({\n      modelConfigKey: { model: modelStringToModelConfigAlias(model) },\n      contents: [\n        ...historyForSummarizer,\n        {\n          role: 'user',\n          parts: [\n            {\n              text: `${anchorInstruction}\\n\\nFirst, reason in your scratchpad. Then, generate the updated <state_snapshot>.`,\n            },\n          ],\n        },\n      ],\n      systemInstruction: { text: getCompressionPrompt(config) },\n      promptId,\n      // TODO(joshualitt): wire up a sensible abort signal,\n      abortSignal: abortSignal ?? new AbortController().signal,\n      role: LlmRole.UTILITY_COMPRESSOR,\n    });", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L587-L613"}, {"path": "packages/core/src/context/chatCompressionService.ts", "start": 616, "end": 645, "expect": "Critically evaluate", "title": "Second call: the snapshot checks itself", "note": "If the second call returns nothing, the first summary is used.", "code": "    // Phase 3: The \"Probe\" Verification (Self-Correction)\n    // We perform a second lightweight turn to ensure no critical information was lost.\n    const verificationResponse = await config\n      .getBaseLlmClient()\n      .generateContent({\n        modelConfigKey: { model: modelStringToModelConfigAlias(model) },\n        contents: [\n          ...historyForSummarizer,\n          {\n            role: 'model',\n            parts: [{ text: summary }],\n          },\n          {\n            role: 'user',\n            parts: [\n              {\n                text: 'Critically evaluate the <state_snapshot> you just generated. Did you omit any specific technical details, file paths, tool results, or user constraints mentioned in the history? If anything is missing or could be more precise, generate a FINAL, improved <state_snapshot>. Otherwise, rep
