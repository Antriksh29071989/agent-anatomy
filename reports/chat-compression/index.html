<script type="application/json" id="aa-data">{"meta": {"question": "How does Gemini CLI compress chat history when the context fills up?", "title": "Chat compression", "slug": "chat-compression", "analysed_at": "2026-10-03", "hook": "At 50% of the window it keeps the newest 30% and turns the rest into a snapshot the model then critiques.", "site_url": "https://antriksh29071989.github.io/agent-anatomy/reports/chat-compression/"}, "answer": "When the prompt reaches 50% of the model's token limit [^threshold], Gemini CLI keeps roughly the newest 30% of the conversation [^preserve] and replaces the older part with a structured `<state_snapshot>` written by a model [^snapshot]. It makes two model calls: one to write the snapshot and one asking the model to critique it [^verify]. If the new history has more tokens than the original, it is thrown away [^inflated]. An unforced failure of that kind sets a flag [^flag], and while it is set automatic attempts only truncate old tool outputs [^trunconly].", "repos": [{"id": "gemini-cli", "repo": "google-gemini/gemini-cli", "commit": "fb972b2f87fe7d5b06d37eac711490162d98de2c", "commit_date": "2026-10-02", "kind": "product", "language": "TypeScript", "license": "Apache-2.0", "what": "Google's terminal coding agent", "verdict": "implements", "summary": "A `ChatCompressionService` [^service] called from the turn [^callsite]: a threshold check [^trigger], a budget pass over old tool outputs [^truncfirst], a split at a safe message boundary [^splitrule], a model-written state snapshot [^snapshot] with a self-critique pass [^verify], and a guard that rejects a result with more tokens than the original [^inflated].", "url": "https://github.com/google-gemini/gemini-cli"}], "comparison": {"dimensions": ["Trigger", "What is kept", "What is summarised", "How", "If it fails"], "rows": [{"repo": "gemini-cli", "cells": ["Prompt tokens reach 50% of the model's limit [^trigger][^threshold]. The fraction is configurable [^setting], and the compress command forces it [^forcecmd]", "About the newest 30% of the history [^preserve], cut at a user message that is not a tool response [^splitrule]. Tool responses beyond a 50,000-token budget [^budget] are saved to a file [^overbudget] and, if longer than a character limit, shortened to its first 20% and last 80% [^truncfmt]", "Everything before the split point, about 70% [^splitcall]", "Two model calls: write a `<state_snapshot>` [^snapshot], then critique it [^verify]. The snapshot is inserted as a user message followed by a fixed model acknowledgement [^newhistory]", "Empty summary: nothing changes [^empty]. More tokens than before: discarded [^inflated]. An unforced failure of that kind sets a flag [^flag], and while it is set automatic attempts only truncate tool outputs [^trunconly]"]}]}, "deep_dives": [{"repo": "gemini-cli", "headline": "Truncate, split, snapshot, verify, and reject if it grew", "how_it_works": ["After its turn-limit checks [^earlyreturn], the turn branches on whether context management is enabled [^cmif]; in the else branch of that check it calls `tryCompressChat` [^callsite]. The service first decides whether to act at all: it takes the token count of the last prompt [^tokens] and compares it with the threshold times the model's token limit [^trigger]. The default threshold is 0.5 [^threshold], so compression starts at half the context window. The compress command sets `force` [^forcecmd], which skips this check [^trigger].", "Before summarising anything, it runs `truncateHistoryToBudget` over the whole history [^truncfirst]. Walking from newest to oldest [^walk], it keeps tool responses in full while they fit a 50,000-token budget [^budget][^inbudget]. A response that would exceed the budget is saved to a file and replaced with a shortened version [^overbudget]: unchanged if it is within a character limit, otherwise its first 20% and last 80% of that limit [^truncfmt]. The limit is the smaller of a configured threshold and four times the remaining context tokens [^truncthreshold].", "Then it picks the split point, asking for a cut after 70% of the content [^splitcall]. `findCompressSplitPoint` measures each message by its JSON length [^charcount] and returns the first user message that is not a tool response once the target is reached [^splitrule]. If no such point exists, it compresses everything, but only when the last message is a model message with no pending tool call [^splitall].", "The older part is sent to a model with a dedicated system prompt and an instruction to produce a `<state_snapshot>`; if an earlier snapshot is already in the history, the instruction is to integrate it into the new one [^snapshot]. The prompt fixes the snapshot's sections: overall goal, active constraints and key knowledge [^sections1], then artifact trail, file system state, recent actions and task state [^sections2]. A second call hands the model its own snapshot and asks it to critically evaluate it [^verify]; the text of that second response becomes the summary, with the first as the fallback [^final].", "The new history is the snapshot as a user message, a fixed model reply, and the kept recent turns [^newhistory]. If its token count is higher than the original, the result is discarded [^inflated] and, when the attempt was not forced, the client sets a failure flag [^flag]. While that flag is set, automatic attempts skip the summariser: they return the truncated history if it is smaller and otherwise do nothing [^trunconly][^truncnoop]. Starting a new chat clears the flag [^reset]. On success, the client starts a fresh chat session with the new history [^newchat] and the turn emits a `ChatCompressed` event [^callsite]."], "diagram": {"caption": "An unforced size failure sets a flag [^flag]; while it is set, automatic attempts take the truncation-only path [^trunconly].", "mermaid": "flowchart TB\n  turn[\"Start of a turn<br/>tryCompressChat\"]:::external --> chk{\"Tokens at or above<br/>50 percent of limit?\"}:::component\n  chk -->|\"no\"| noop[\"No change\"]:::store\n  chk -->|\"yes, or forced\"| trunc[\"truncateHistoryToBudget<br/>trim old tool outputs\"]:::component\n  trunc --> failed{\"Failure flag set<br/>and not forced?\"}:::component\n  failed -->|\"yes\"| tonly[\"Truncation only<br/>no model call\"]:::store\n  failed -->|\"no\"| split[\"findCompressSplitPoint<br/>keep newest 30 percent\"]:::component\n  split --> snap[\"Model writes<br/>state_snapshot\"]:::system\n  snap --> verify[\"Model critiques<br/>and rewrites it\"]:::system\n  verify --> count{\"New history has<br/>more tokens?\"}:::component\n  count -->|\"no\"| done[\"New chat session<br/>COMPRESSED\"]:::store\n  count -->|\"yes\"| flag[\"Discard result<br/>flag if not forced\"]:::queue\n"}, "key_parts": [{"name": "ChatCompressionService.compress", "path": "packages/core/src/context/chatCompressionService.ts", "role": "The whole procedure: threshold check, truncation, split, two model calls, size guard", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "DEFAULT_COMPRESSION_TOKEN_THRESHOLD", "path": "packages/core/src/context/chatCompressionService.ts", "role": "0.5: the fraction of the model's token limit at which compression starts", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "COMPRESSION_PRESERVE_THRESHOLD", "path": "packages/core/src/context/chatCompressionService.ts", "role": "0.3: the fraction of recent history kept verbatim", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "COMPRESSION_FUNCTION_RESPONSE_TOKEN_BUDGET", "path": "packages/core/src/context/chatCompressionService.ts", "role": "50,000 tokens of tool responses kept in full before older ones are truncated", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "findCompressSplitPoint", "path": "packages/core/src/context/chatCompressionService.ts", "role": "Chooses a cut that never separates a tool call from its response", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "getCompressionPrompt", "path": "packages/core/src/prompts/snippets.ts", "role": "The summariser's system prompt and the snapshot's XML structure", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/prompts/snippets.ts"}, {"name": "GeminiClient.tryCompressChat", "path": "packages/core/src/core/client.ts", "role": "Calls the service each turn, applies the result and remembers a failed attempt", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts"}, {"name": "compressCommand", "path": "packages/cli/src/ui/commands/compressCommand.ts", "role": "The manual command, which calls `tryCompressChat` with `force` set", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/cli/src/ui/commands/compressCommand.ts"}], "excerpts": [{"path": "packages/core/src/context/chatCompressionService.ts", "start": 495, "end": 519, "expect": "isOverModelThreshold", "title": "The trigger", "note": "It uses the token count of the last prompt when that is above zero and an estimate otherwise [^tokens]. `force` skips the check [^trigger].", "code": "    const lastPromptTokenCount = chat.getLastPromptTokenCount();\n    const originalTokenCount =\n      lastPromptTokenCount > 0\n        ? lastPromptTokenCount\n        : estimateTokenCountSync(curatedHistory.flatMap((c) => c.parts || []));\n\n    // Don't compress if not forced and we are under the limit.\n    if (!force) {\n      const threshold =\n        (await config.getCompressionThreshold()) ??\n        DEFAULT_COMPRESSION_TOKEN_THRESHOLD;\n      const isOverModelThreshold =\n        originalTokenCount >= threshold * tokenLimit(model);\n\n      if (!isOverModelThreshold) {\n        return {\n          newHistory: null,\n          info: {\n            originalTokenCount,\n            newTokenCount: originalTokenCount,\n            compressionStatus: CompressionStatus.NOOP,\n          },\n        };\n      }\n    }", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L495-L519"}, {"path": "packages/core/src/context/chatCompressionService.ts", "start": 282, "end": 322, "expect": "findCompressSplitPoint", "title": "Choosing where to cut", "note": "Called with a fraction of 0.7 [^splitcall]. Inside the loop it only splits at a user message that is not a tool response [^splitrule]; after the loop it may return the full length to compress everything [^splitall].", "code": "export function findCompressSplitPoint(\n  contents: Content[],\n  fraction: number,\n): number {\n  if (fraction <= 0 || fraction >= 1) {\n    throw new Error('Fraction must be between 0 and 1');\n  }\n\n  const charCounts = contents.map((content) => JSON.stringify(content).length);\n  const totalCharCount = charCounts.reduce((a, b) => a + b, 0);\n  const targetCharCount = totalCharCount * fraction;\n\n  let lastSplitPoint = 0; // 0 is always valid (compress nothing)\n  let cumulativeCharCount = 0;\n  for (let i = 0; i < contents.length; i++) {\n    const content = contents[i];\n    if (\n      content.role === 'user' &&\n      !content.parts?.some((part) => !!part.functionResponse)\n    ) {\n      if (cumulativeCharCount >= targetCharCount) {\n        return i;\n      }\n      lastSplitPoint = i;\n    }\n    cumulativeCharCount += charCounts[i];\n  }\n\n  // We found no split points after targetCharCount.\n  // Check if it's safe to compress everything.\n  const lastContent = contents[contents.length - 1];\n  if (\n    lastContent?.role === 'model' &&\n    !lastContent?.parts?.some((part) => part.functionCall)\n  ) {\n    return contents.length;\n  }\n\n  // Can't compress everything so just compress at last splitpoint.\n  return lastSplitPoint;\n}", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L282-L322"}, {"path": "packages/core/src/context/chatCompressionService.ts", "start": 587, "end": 613, "expect": "state_snapshot", "title": "First call: write the snapshot", "note": "If the history already contains a `<state_snapshot>` tag, the model is told to integrate it into the new one [^snapshot].", "code": "    const hasPreviousSnapshot = historyForSummarizer.some((c) =>\n      c.parts?.some((p) => p.text?.includes('<state_snapshot>')),\n    );\n\n    const anchorInstruction = hasPreviousSnapshot\n      ? 'A previous <state_snapshot> exists in the history. You MUST integrate all still-relevant information from that snapshot into the new one, updating it with the more recent events. Do not lose established constraints or critical knowledge.'\n      : 'Generate a new <state_snapshot> based on the provided history.';\n\n    const summaryResponse = await config.getBaseLlmClient().generateContent({\n      modelConfigKey: { model: modelStringToModelConfigAlias(model) },\n      contents: [\n        ...historyForSummarizer,\n        {\n          role: 'user',\n          parts: [\n            {\n              text: `${anchorInstruction}\\n\\nFirst, reason in your scratchpad. Then, generate the updated <state_snapshot>.`,\n            },\n          ],\n        },\n      ],\n      systemInstruction: { text: getCompressionPrompt(config) },\n      promptId,\n      // TODO(joshualitt): wire up a sensible abort signal,\n      abortSignal: abortSignal ?? new AbortController().signal,\n      role: LlmRole.UTILITY_COMPRESSOR,\n    });", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L587-L613"}, {"path": "packages/core/src/context/chatCompressionService.ts", "start": 616, "end": 645, "expect": "Critically evaluate", "title": "Second call: the snapshot checks itself", "note": "If the second call returns no text, the first summary is used [^final].", "code": "    // Phase 3: The \"Probe\" Verification (Self-Correction)\n    // We perform a second lightweight turn to ensure no critical information was lost.\n    const verificationResponse = await config\n      .getBaseLlmClient()\n      .generateContent({\n        modelConfigKey: { model: modelStringToModelConfigAlias(model) },\n        contents: [\n          ...historyForSummarizer,\n          {\n            role: 'model',\n            parts: [{ text: summary }],\n          },\n          {\n            role: 'user',\n            parts: [\n              {\n                text: 'Critically evaluate the <state_snapshot> you just generated. Did you omit any specific technical details, file paths, tool results, or user constraints mentioned in the history? If anything is missing or could be more precise, generate a FINAL, improved <state_snapshot>. Otherwise, repeat the exact same <state_snapshot> again.',\n              },\n            ],\n          },\n        ],\n        systemInstruction: { text: getCompressionPrompt(config) },\n        promptId: `${promptId}-verify`,\n        role: LlmRole.UTILITY_COMPRESSOR,\n        abortSignal: abortSignal ?? new AbortController().signal,\n      });\n\n    const finalSummary = (\n      getResponseText(verificationResponse)?.trim() || summary\n    ).trim();", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L616-L645"}, {"path": "packages/core/src/prompts/snippets.ts", "start": 926, "end": 968, "expect": "<overall_goal>", "title": "What the snapshot must contain", "note": "The structure ends with a task state section, just before the closing tag [^taskstate].", "code": "The structure MUST be as follows:\n\n<state_snapshot>\n    <overall_goal>\n        <!-- A single, concise sentence describing the user's high-level objective. -->\n    <\/overall_goal>\n\n    <active_constraints>\n        <!-- Explicit constraints, preferences, or technical rules established by the user or discovered during development. -->\n        <!-- Example: \"Use tailwind for styling\", \"Keep functions under 20 lines\", \"Avoid modifying the 'legacy/' directory.\" -->\n    <\/active_constraints>\n\n    <key_knowledge>\n        <!-- Crucial facts and technical discoveries. -->\n        <!-- Example:\n         - Build Command: \\`npm run build\\`\n         - Port 3000 is occupied by a background process.\n         - The database uses CamelCase for column names.\n        -->\n    <\/key_knowledge>\n\n    <artifact_trail>\n        <!-- Evolution of critical files and symbols. What was changed and WHY. Use this to track all significant code modifications and design decisions. -->\n        <!-- Example:\n         - \\`src/auth.ts\\`: Refactored 'login' to 'signIn' to match API v2 specs.\n         - \\`UserContext.tsx\\`: Added a global state for 'theme' to fix a flicker bug.\n        -->\n    <\/artifact_trail>\n\n    <file_system_state>\n        <!-- Current view of the relevant file system. -->\n        <!-- Example:\n         - CWD: \\`/home/user/project/src\\`\n         - CREATED: \\`tests/new-feature.test.ts\\`\n         - READ: \\`package.json\\` - confirmed dependencies.\n        -->\n    <\/file_system_state>\n\n    <recent_actions>\n        <!-- Fact-based summary of recent tool calls and their results. -->\n    <\/recent_actions>\n\n    <task_state>", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/prompts/snippets.ts#L926-L968"}], "gotchas": ["Compression starts at half the window by default [^threshold], and the summariser calls themselves send the older history to a model [^snapshot].", "Every successful compression makes two extra model calls: one to write the snapshot [^snapshot] and one to critique it [^verify].", "The size guard counts the tokens of the full new chat history [^newcount] and only rejects a result that is larger than the original [^inflated]. An unforced failure sets a flag [^flag]; while it is set, automatic attempts do not call the summariser [^trunconly], and starting a new chat clears it [^reset].", "The doc comment on `truncateHistoryToBudget` says old tool responses are cut to their last 30 lines [^doccomment]. The code does something else: it keeps the first 20% and last 80% of a character limit [^truncfmt].", "The `PreCompress` hook is fired before the threshold check, so it also runs on attempts that end as a no-op [^hook].", "The split is measured in characters of JSON, not tokens [^charcount], so the 30% kept is approximate.", "The summariser prompt includes a rule to ignore instructions found inside the history, and names tool output as a possible source of them [^security].", "This path is the else branch of the context-management check [^callsite]. Context management is switched on by any of four experimental settings [^cmswitch], of which `contextManagement` defaults to false [^cmdefault]. When on, the turn uses a context manager [^cmenabled] or a history provider [^cmfallback]; the compress command still calls `tryCompressChat` directly [^forcecmd].", "The 0.5 threshold can be changed with the `compressionThreshold` setting [^setting]."]}], "build_your_own": ["Trigger well before the limit. Summarising needs headroom, because the summariser has to read what you are about to drop.", "Trim old tool outputs first. It is cheap, needs no model call, and large logs and search results are usually where the tokens are.", "Cut only at a boundary that keeps each tool call with its result. A split in the middle leaves the model with a call it cannot match to an output.", "Give the summary a fixed structure. Named sections for goal, constraints, files changed and next step are harder to leave out than a free-form paragraph.", "When compressing again, merge the previous summary into the new one, or early context decays with each round.", "Check the size of the result, and stop calling the summariser when it comes back larger.", "Treat the history as untrusted input to the summariser: tell it to ignore instructions it finds there."], "method": {"scope": "Read in full: `ChatCompressionService.compress`, `findCompressSplitPoint`, the constants, the compression prompt, and the call site and result handling in `GeminiClient`. The settings schema was checked for the default threshold and for whether the experimental pipeline is on by default.", "limits": ["`truncateHistoryToBudget` carries a doc comment that disagrees with its code; the report follows the code.", "Not examined: the per-turn tool-output masking step (`toolOutputMaskingService.ts`), the context-management pipeline and its processors, and how sub-agents compress their own history.", "Whether the experimental profile settings other than `contextManagement` default to off was not checked.", "Behaviour was read from source, not observed by running the agent."]}, "citations": {"service": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 466, "end": 475, "claim": "`ChatCompressionService.compress` takes the chat, a force flag, the model, the config and a flag saying whether an earlier compression attempt failed.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L466-L475"}, "callsite": {"repo": "gemini-cli", "path": "packages/core/src/core/client.ts", "start": 702, "end": 707, "claim": "The `else` at line 702, which pairs with the `if` on `getContextManagementConfig().enabled` at line 657, calls `tryCompressChat` with force set to false and yields a `ChatCompressed` event when the status is COMPRESSED.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts#L702-L707"}, "tokens": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 495, "end": 499, "claim": "The token count used is the last prompt's token count, or an estimate of the curated history when that count is zero.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L495-L499"}, "trigger": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 501, "end": 507, "claim": "Unless forced, compression only proceeds when the token count is at least the threshold multiplied by the model's token limit, with the threshold taken from config and falling back to the default constant.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L501-L507"}, "threshold": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 41, "end": 45, "claim": "The default compression threshold is 0.5 of the model's token limit.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L41-L45"}, "setting": {"repo": "gemini-cli", "path": "packages/cli/src/config/settingsSchema.ts", "start": 1111, "end": 1118, "claim": "There is a user setting `compressionThreshold` with a default of 0.5.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/cli/src/config/settingsSchema.ts#L1111-L1118"}, "forcecmd": {"repo": "gemini-cli", "path": "packages/cli/src/ui/commands/compressCommand.ts", "start": 45, "end": 47, "claim": "The compress command calls `tryCompressChat` with force set to true.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/cli/src/ui/commands/compressCommand.ts#L45-L47"}, "truncfirst": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 521, "end": 526, "claim": "Token-based truncation is applied to the whole history before it is split.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L521-L526"}, "budget": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 271, "end": 274, "claim": "The budget for function-response tokens in the preserved history is 50,000.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L271-L274"}, "preserve": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 265, "end": 269, "claim": "The fraction of the latest chat history kept after compression is 0.3.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L265-L269"}, "splitcall": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 557, "end": 560, "claim": "The split point is computed with a fraction of 1 minus the preserve threshold, which is 0.7.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L557-L560"}, "charcount": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 290, "end": 292, "claim": "Each message's size for the split is measured as the length of its JSON string, in characters, not tokens.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L290-L292"}, "splitrule": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 296, "end": 308, "claim": "The split point is the first user message that has no function response, once the cumulative character count has reached the target.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L296-L308"}, "splitall": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 310, "end": 321, "claim": "If no split point is found past the target, everything is compressed only when the last message is a model message with no function call; otherwise the last valid split point is used.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L310-L321"}, "snapshot": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 587, "end": 608, "claim": "The summariser is called with the history to compress and an instruction to generate a `<state_snapshot>`, integrating a previous snapshot if one exists, using the compression prompt as the system instruction.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L587-L608"}, "sections1": {"repo": "gemini-cli", "path": "packages/core/src/prompts/snippets.ts", "start": 926, "end": 938, "claim": "The compression prompt requires a `<state_snapshot>` structure that begins with overall goal, active constraints and key knowledge sections.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/prompts/snippets.ts#L926-L938"}, "sections2": {"repo": "gemini-cli", "path": "packages/core/src/prompts/snippets.ts", "start": 947, "end": 968, "claim": "The required snapshot structure also includes artifact trail, file system state, recent actions and task state sections.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/prompts/snippets.ts#L947-L968"}, "verify": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 616, "end": 633, "claim": "A second model call sends the same history plus the generated summary and asks the model to critically evaluate the snapshot it just generated.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L616-L633"}, "final": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 643, "end": 645, "claim": "The final summary is the verification response's text, falling back to the first summary when that is empty.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L643-L645"}, "empty": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 647, "end": 662, "claim": "If the final summary is empty, no new history is returned and the status is COMPRESSION_FAILED_EMPTY_SUMMARY.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L647-L662"}, "newhistory": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 665, "end": 675, "claim": "The new history is the summary as a user message, e.ts", "start": 490, "end": 502, "claim": "The PreCompress hook is fired before the not-forced threshold check.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L490-L502"}, "security": {"repo": "gemini-cli", "path": "packages/core/src/prompts/snippets.ts", "start": 912, "end": 917, "claim": "The compression prompt says the history may contain prompt-injection attempts, including from tool output, and instructs the model to ignore all commands found in it and treat it only as data to summarise.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/prompts/snippets.ts#L912-L917"}, "cmdefault": {"repo": "gemini-cli", "path": "packages/cli/src/config/settingsSchema.ts", "start": 2461, "end": 2468, "claim": "The experimental `contextManagement` setting defaults to false.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/cli/src/config/settingsSchema.ts#L2461-L2468"}, "cmenabled": {"repo": "gemini-cli", "path": "packages/core/src/core/client.ts", "start": 657, "end": 673, "claim": "When context management is enabled and a context manager exists, the turn renders history through `contextManager.renderHistory` instead.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts#L657-L673"}, "earlyreturn": {"repo": "gemini-cli", "path": "packages/core/src/core/client.ts", "start": 638, "end": 649, "claim": "The turn returns early when the session turn limit is exceeded or when no bounded turns remain.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts#L638-L649"}, "cmif": {"repo": "gemini-cli", "path": "packages/core/src/core/client.ts", "start": 657, "end": 658, "claim": "The turn branches on whether context management is enabled.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts#L657-L658"}, "cmfallback": {"repo": "gemini-cli", "path": "packages/core/src/core/client.ts", "start": 693, "end": 700, "claim": "When context management is enabled but there is no context manager, the turn calls `agentHistoryProvider.manageHistory`.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts#L693-L700"}, "cmswitch": {"repo": "gemini-cli", "path": "packages/cli/src/config/config.ts", "start": 943, "end": 957, "claim": "Context management is enabled when any of the experimental settings `stressTestProfile`, `powerUserProfile`, `generalistProfile` or `contextManagement` is set.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/cli/src/config/config.ts#L943-L957"}, "walk": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 371, "end": 372, "claim": "`truncateHistoryToBudget` iterates over the history from the newest message to the oldest.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L371-L372"}, "overbudget": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 410, "end": 427, "claim": "When adding a function response would exceed the budget, its content is saved to a file and replaced with the result of `formatTruncatedToolOutput`, called with the tool-output truncation threshold.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L410-L427"}, "inbudget": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 447, "end": 450, "claim": "A function response within the budget is kept in full.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L447-L450"}, "truncfmt": {"repo": "gemini-cli", "path": "packages/core/src/utils/fileUtils.ts", "start": 779, "end": 785, "claim": "`formatTruncatedToolOutput` returns the content unchanged when it is no longer than the character limit; otherwise it keeps the first 20% and the last 80% of the allowed characters.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/utils/fileUtils.ts#L779-L785"}, "truncthreshold": {"repo": "gemini-cli", "path": "packages/core/src/config/config.ts", "start": 3842, "end": 3848, "claim": "The truncation threshold is the smaller of four times the remaining context tokens and the configured threshold.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/config/config.ts#L3842-L3848"}, "doccomment": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 351, "end": 362, "claim": "The doc comment of `truncateHistoryToBudget` says older large tool responses are truncated to their last 30 lines.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L351-L362"}, "reset": {"repo": "gemini-cli", "path": "packages/core/src/core/client.ts", "start": 394, "end": 399, "claim": "`startChat` sets `hasFailedCompressionAttempt` to false.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts#L394-L399"}, "truncnoop": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 535, "end": 554, "claim": "In the truncation-only path, the truncated history is returned only if its token count is lower than the original; otherwise the result is a no-op.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L535-L554"}, "newcount": {"repo": "gemini-cli", "path": "packages/core/src/context/chatCompressionService.ts", "start": 677, "end": 686, "claim": "The new token count is calculated over the full initial chat history built from the new history.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L677-L686"}, "taskstate": {"repo": "gemini-cli", "path": "packages/core/src/prompts/snippets.ts", "start": 968, "end": 976, "claim": "The `<task_state>` section is the last section before the closing `<\/state_snapshot>` tag.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/prompts/snippets.ts#L968-L976"}}, "implementation": {"title": "Chat compression in about 140 lines of Python", "intro": "Five small functions and a caller class, standard library only. It follows Gemini CLI's procedure step for step: threshold check, tool-output budget, safe split, snapshot, self-critique, size guard and the failure flag. You pass in the function that calls your model.", "dir": "impl", "files": [{"name": "chat_compressor.py", "code": "\"\"\"Chat history compression for an agent: a small reference implementation.\n\nIt follows the design of Gemini CLI's chat compression, described with source\ncitations in the report this file belongs to: check a threshold, trim old tool\noutputs, split at a safe boundary, have a model write a state snapshot and then\ncritique it, and reject a result that came out larger.\n\nWritten from scratch for teaching. It is not code from that project.\n\nA history is a list of messages: {\"role\": \"user\" | \"model\", \"parts\": [...]},\nwhere a part is {\"text\": str}, {\"function_call\": {...}} or\n{\"function_response\": {\"name\": str, \"output\": str}}.\n\"\"\"\nimport json\n\nDEFAULT_COMPRESSION_TOKEN_THRESHOLD = 0.5      # compress at this fraction of the token limit\nCOMPRESSION_PRESERVE_THRESHOLD = 0.3           # keep this fraction of recent history verbatim\nFUNCTION_RESPONSE_TOKEN_BUDGET = 50_000        # tool output kept in full, newest first\nACK = \"Got it. Thanks for the additional context!\"\n\n\ndef estimate_tokens(history):\n    \"\"\"A rough count: about four characters per token.\"\"\"\n    return sum(len(json.dumps(m[\"parts\"])) for m in history) // 4\n\n\ndef truncate_output(text, max_chars):\n    \"\"\"Leave short output alone; otherwise keep the first 20% and last 80% of the limit.\"\"\"\n    if max_chars <= 0 or len(text) <= max_chars:\n        return text\n    head = int(max_chars * 0.2)\n    tail = max_chars - head\n    omitted = len(text) - head - tail\n    return f\"{text[:head]}\\n\\n... [{omitted} characters omitted] ...\\n\\n{text[-tail:]}\"\n\n\ndef truncate_history_to_budget(history, max_chars):\n    \"\"\"Walk newest to oldest; once tool output exceeds the budget, shorten older ones.\"\"\"\n    used, out = 0, []\n    for message in reversed(history):\n        parts = []\n        for part in reversed(message[\"parts\"]):\n            response = part.get(\"function_response\")\n            if response:\n                tokens = len(response[\"output\"]) // 4\n                if used + tokens > FUNCTION_RESPONSE_TOKEN_BUDGET:\n                    short = truncate_output(response[\"output\"], max_chars)\n                    part = {\"function_response\": {**response, \"output\": short}}\n                    tokens = len(short) // 4\n                used += tokens\n            parts.insert(0, part)\n        out.insert(0, {**message, \"parts\": parts})\n    return out\n\n\ndef find_split_point(history, fraction):\n    \"\"\"Index of the oldest message to keep. Splits only where a tool call is not cut from its result.\"\"\"\n    sizes = [len(json.dumps(m)) for m in history]\n    target = sum(sizes) * fraction\n    last_split, seen = 0, 0\n    for i, message in enumerate(history):\n        is_plain_user = message[\"role\"] == \"user\" and not any(\n            \"function_response\" in p for p in message[\"parts\"])\n        if is_plain_user:\n            if seen >= target:\n                return i\n            last_split = i\n        seen += sizes[i]\n    last = history[-1]\n    if last[\"role\"] == \"model\" and not any(\"function_call\" in p for p in last[\"parts\"]):\n        return len(history)          # safe to compress everything\n    return last_split\n\n\ndef compress(history, token_limit, summarise, *, last_prompt_tokens=0, force=False,\n             failed_before=False, threshold=DEFAULT_COMPRESSION_TOKEN_THRESHOLD,\n             max_chars=40_000):\n    \"\"\"Return (new_history or None, status). `summarise(messages, instruction)` calls a model.\"\"\"\n    if not history:\n        return None, \"NOOP\"\n    original = last_prompt_tokens if last_prompt_tokens > 0 else estimate_tokens(history)\n    if not force and original < threshold * token_limit:\n        return None, \"NOOP\"\n\n    truncated = truncate_history_to_budget(history, max_chars)\n    if failed_before and not force:          # summarising failed earlier: truncate only\n        if estimate_tokens(truncated) < original:\n            return truncated, \"CONTENT_TRUNCATED\"\n        return None, \"NOOP\"\n\n    split = find_split_point(truncated, 1 - COMPRESSION_PRESERVE_THRESHOLD)\n    to_compress, to_keep = truncated[:split], truncated[split:]\n    if not to_compress:\n        return None, \"NOOP\"\n\n    has_snapshot = any(\"<state_snapshot>\" in p.get(\"text\", \"\")\n                       for m in to_compress for p in m[\"parts\"])\n    instruction = (\"A previous <state_snapshot> exists in the history. Integrate everything \"\n                   \"still relevant from it into the new one.\"\n                   if has_snapshot else \"Generate a new <state_snapshot> from this history.\")\n    instruction += \"\\n\\nFirst, reason in your scratchpad. Then, generate the updated <state_snapshot>.\"\n    summary = summarise(to_compress, instruction) or \"\"\n    checked = summarise(\n        to_compress + [{\"role\": \"model\", \"parts\": [{\"text\": summary}]}],\n        \"Critically evaluate the <state_snapshot> you just generated. If anything is missing \"\n        \"or could be more precise, generate a final, improved <state_snapshot>. Otherwise, \"\n        \"repeat the exact same <state_snapshot> again.\")\n    final = ((checked or \"\").strip() or summary).strip()\n    if not final:\n        return None, \"COMPRESSION_FAILED_EMPTY_SUMMARY\"\n\n    new_history = [{\"role\": \"user\", \"parts\": [{\"text\": final}]},\n                   {\"role\": \"model\", \"parts\": [{\"text\": ACK}]}] + to_keep\n    if estimate_tokens(new_history) > original:\n        return None, \"COMPRESSION_FAILED_INFLATED_TOKEN_COUNT\"\n    return new_history, \"COMPRESSED\"\n\n\nclass Chat:\n    \"\"\"The caller's side: applies the result and remembers a failed attempt.\"\"\"\n\n    def __init__(self, token_limit, summarise):\n        self.history, self.token_limit, self.summarise = [], token_limit, summarise\n        self.failed = False\n        self.last_prompt_tokens = 0     # set this from your model API's usage report\n\n    def try_compress(self, force=False):\n        new_history, status = compress(self.history, self.token_limit, self.summarise,\n                                       last_prompt_tokens=self.last_prompt_tokens,\n                                       force=force, failed_before=self.failed)\n        if status == \"COMPRESSION_FAILED_INFLATED_TOKEN_COUNT\":\n            self.failed = self.failed or not force\n        elif status == \"COMPRESSED\":\n            self.history, self.failed = new_history, False   # a new chat clears the flag\n        elif status == \"CONTENT_TRUNCATED\":\n            self.history = new_history                        # the flag stays set\n        if new_history is not None:\n            self.last_prompt_tokens = 0     # the old count no longer describes the history\n        return status", "href": "impl/chat_compressor.py"}, {"name": "test_chat_compressor.py", "code": "\"\"\"Tests for chat_compressor.py. Run: python3 -m unittest -v\"\"\"\nimport unittest\n\nfrom chat_compressor import (ACK, Chat, compress, estimate_tokens, find_split_point,\n                             truncate_history_to_budget, truncate_output)\n\n\ndef user(text):\n    return {\"role\": \"user\", \"parts\": [{\"text\": text}]}\n\n\ndef model(text):\n    return {\"role\": \"model\", \"parts\": [{\"text\": text}]}\n\n\ndef tool_call(name):\n    return {\"role\": \"model\", \"parts\": [{\"function_call\": {\"name\": name}}]}\n\n\ndef tool_result(name, output):\n    return {\"role\": \"user\", \"parts\": [{\"function_response\": {\"name\": name, \"output\": output}}]}\n\n\ndef conversation(turns, size=400):\n    out = []\n    for i in range(turns):\n        out += [user(f\"question {i} \" + \"x\" * size), model(f\"answer {i} \" + \"y\" * size)]\n    return out\n\n\nclass FakeModel:\n    \"\"\"Stands in for the summariser and records what it was asked.\"\"\"\n\n    def __init__(self, replies):\n        self.replies, self.calls = list(replies), []\n\n    def __call__(self, messages, instruction):\n        self.calls.append((messages, instruction))\n        return self.replies.pop(0)\n\n\nclass Trigger(unittest.TestCase):\n    def test_below_threshold_does_nothing_and_calls_no_model(self):\n        fake = FakeModel([])\n        result, status = compress(conversation(4), 1_000_000, fake)\n        self.assertEqual((result, status), (None, \"NOOP\"))\n        self.assertEqual(fake.calls, [])\n\n    def test_exactly_half_the_limit_compresses_and_just_under_does_not(self):\n        history = conversation(10)\n        tokens = estimate_tokens(history)\n        fake = FakeModel([\"<state_snapshot>s<\/state_snapshot>\", \"<state_snapshot>better<\/state_snapshot>\"])\n        self.assertEqual(compress(history, tokens * 2 + 2, fake)[1], \"NOOP\")\n        self.assertEqual(compress(history, tokens * 2, fake)[1], \"COMPRESSED\")\n\n    def test_force_skips_the_threshold(self):\n        fake = FakeModel([\"<state_snapshot>s<\/state_snapshot>\", \"\"])\n        _, status = compress(conversation(10), 10_000_000, fake, force=True)\n        self.assertEqual(status, \"COMPRESSED\")\n\n\nclass SplitPoint(unittest.TestCase):\n    def test_keeps_roughly_the_newest_thirty_percent(self):\n        history = conversation(10)\n        split = find_split_point(history, 0.7)\n        self.assertEqual(history[split][\"role\"], \"user\")\n        self.assertIn(split, (14, 16))\n\n    def test_never_splits_between_a_tool_call_and_its_result(self):\n        history = [user(\"go\"), tool_call(\"ls\"), tool_result(\"ls\", \"a\" * 5000), model(\"done\")]\n        split = find_split_point(history, 0.7)\n        self.assertIn(split, (0, len(history)))   # never index 2, the tool result\n\n    def test_does_not_compress_everything_while_a_tool_call_is_pending(self):\n        history = [user(\"go\"), tool_call(\"ls\")]\n        self.assertEqual(find_split_point(history, 0.7), 0)\n\n\nclass ToolOutputBudget(unittest.TestCase):\n    def test_short_output_is_left_alone(self):\n        self.assertEqual(truncate_output(\"abc\", 10), \"abc\")\n\n    def test_long_output_keeps_first_20_and_last_80_percent(self):\n        text = \"H\" * 50 + \"M\" * 900 + \"T\" * 50\n        short = truncate_output(text, 100)\n        self.assertTrue(short.startswith(\"H\" * 20))\n        self.assertTrue(short.endswith(\"M\" * 30 + \"T\" * 50))\n        self.assertIn(\"900 characters omitted\", short)\n\n    def test_newest_outputs_survive_and_older_ones_are_shortened(self):\n        big = \"z\" * 150_000                      # about 37,500 tokens each\n        history = [tool_result(\"old\", big), tool_result(\"new\", big)]\n        out = truncate_history_to_budget(history, max_chars=1000)\n        self.assertEqual(out[1][\"parts\"][0][\"function_response\"][\"output\"], big)\n        self.assertLess(len(out[0][\"parts\"][0][\"function_response\"][\"output\"]), 1200)\n\n\nclass Snapshot(unittest.TestCase):\n    def test_two_model_calls_and_the_second_answer_wins(self):\n        fake = FakeModel([\"first\", \"second\"])\n        result, _ = compress(conversation(10), 1000, fake, last_prompt_tokens=900)\n        self.assertEqual(len(fake.calls), 2)\n        self.assertIn(\"Critically evaluate\", fake.calls[1][1])\n        self.assertEqual(result[0][\"parts\"][0][\"text\"], \"second\")\n        self.assertEqual(result[1][\"parts\"][0][\"text\"], ACK)\n\n    def test_the_check_is_told_to_repeat_the_snapshot_when_nothing_is_missing(self):\n        fake = FakeModel([\"first\", \"second\"])\n        compress(conversation(10), 1000, fake, last_prompt_tokens=900)\n        self.assertIn(\"repeat the exact same <state_snapshot>\", fake.calls[1][1])\n\n    def test_first_summary_is_used_when_the_check_returns_nothing(self):\n        fake = FakeModel([\"first\", \"\"])\n        result, _ = compress(conversation(10), 1000, fake, last_prompt_tokens=900)\n        self.assertEqual(result[0][\"parts\"][0][\"text\"], \"first\")\n\n    def test_an_earlier_snapshot_is_integrated(self):\n        history = [user(\"<state_snapshot>old<\/state_snapshot>\"), model(\"ok\")] + conversation(10)\n        fake = FakeModel([\"s\", \"s2\"])\n        compress(history, 1000, fake, last_prompt_tokens=900)\n        self.assertIn(\"previous <state_snapshot> exists\", fake.calls[0][1])\n\n    def test_empty_summary_changes_nothing(self):\n        fake = FakeModel([\"\", \"\"])\n        result, status = compress(conversation(10), 1000, fake, last_prompt_tokens=900)\n        self.assertEqual((result, status), (None, \"COMPRESSION_FAILED_EMPTY_SUM   function cls(name, key) { return "classDef " + name + " fill:" + v("--d-" + key) + ",stroke:" + v("--rule") + ",stroke-width:1.5px,color:" + v("--d-" + key + "-ink"); }
  var classDefs = "\n" + [cls("person", "ext"), cls("system", "system"), cls("component", "component"), cls("external", "ext"), cls("store", "store"), cls("queue", "queue")].join("\n") + "\n";
  function fail(canvas, msg) { canvas.insertBefore(h("p", { class: "note" }, raw(msg)), canvas.firstChild); }
  if (!canvases.length) return;
  if (!window.mermaid) {
    canvases.forEach(function (c) { fail(c[0], "Diagram renderer could not be loaded (offline?). Source shown instead."); });
    return;
  }
  window.mermaid.initialize({
    startOnLoad: false, securityLevel: "strict", theme: "base",
    themeVariables: {
      fontFamily: v("--body"), fontSize: "14px", background: "transparent",
      primaryColor: v("--d-component"), primaryTextColor: v("--d-component-ink"), primaryBorderColor: v("--rule"),
      lineColor: v("--d-line"), textColor: v("--ink"), mainBkg: v("--d-component"),
      clusterBkg: v("--d-group"), clusterBorder: v("--d-line"), titleColor: v("--ink"),
      edgeLabelBackground: v("--well"), nodeTextColor: v("--d-component-ink"),
      actorBkg: v("--d-component"), actorBorder: v("--rule"), actorTextColor: v("--d-component-ink"), actorLineColor: v("--d-line"),
      signalColor: v("--ink"), signalTextColor: v("--ink"), labelBoxBkgColor: v("--sheet"), labelBoxBorderColor: v("--d-line"),
      labelTextColor: v("--ink"), loopTextColor: v("--ink"), noteBkgColor: v("--sheet"), noteTextColor: v("--ink"), noteBorderColor: v("--d-line"),
      activationBkgColor: v("--well"), activationBorderColor: v("--d-line")
    },
    flowchart: { curve: "basis", useMaxWidth: true, padding: 14, nodeSpacing: 46, rankSpacing: 54 },
    sequence: { useMaxWidth: true, mirrorActors: false, wrap: true }
  });
  canvases.reduce(function (chain, c, i) {
    return chain.then(function () {
      var code = c[1];
      if (/^\s*(flowchart|graph)\b/.test(code)) code += classDefs;
      return window.mermaid.render("aa-diagram-" + i, code).then(function (out) {
        c[0].innerHTML = out.svg;
      }).catch(function (err) {
        fail(c[0], "This diagram could not be rendered: " + String(err && err.message || err).split("\n")[0]);
        var stray = document.getElementById("daa-diagram-" + i); if (stray) stray.remove();
      });
    });
  }, Promise.resolve());
})();
</script>
