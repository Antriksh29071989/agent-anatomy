* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

.hero { background:

  color: var(--hero-ink); padding: 56px 0 44px; }
.kicker { font: 600 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: #7fb7ff; margin: 0 0 18px; }

.answer { font-size: 18px; max-width: 50em; margin: 0 0 28px; padding-left: 16px; border-left: 3px solid #4d9bf0; }

.repos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px; background: var(--hero-line); border: 1px solid var(--hero-line); border-radius: 10px; overflow: hidden; }
.repo { background: rgba(10,17,32,.72); padding: 14px 16px; color: inherit; display: block; }
.repo:hover { text-decoration: none; background: rgba(20,32,58,.8); }
.repo b { display: block; font: 600 19px/1.25 var(--sans); }
.repo span { font: 11px/1.5 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--hero-muted); display: block; }
.meta { margin-top: 18px; font: 12px/1.6 var(--mono); color: var(--hero-muted); }

nav .wrap { display: flex; gap: 20px; overflow-x: auto; padding-top: 11px; padding-bottom: 11px; scrollbar-width: none; }

.num { font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--accent); display: block; margin-bottom: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
h3 { font-size: 18px; line-height: 1.3; margin: 0 0 8px; letter-spacing: -.01em; }
h4 { font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 26px 0 12px; }

.tag { display: inline-block; font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; }

.dive .lead { font-size: 17px; color: var(--ink); }
.canvas { padding: 20px 12px; overflow-x: auto; text-align: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
.canvas svg { max-width: 100%; height: auto; }
.canvas svg .edgeLabel, .canvas svg .edgeLabel p, .canvas svg .edgeLabel span { color: var(--ink) !important; fill: var(--ink) !important; background-color: var(--surface-2) !important; font-size: 12.5px; }
.canvas svg .cluster-label, .canvas svg .cluster-label p, .canvas svg .cluster-label span { color: var(--muted) !important; fill: var(--muted) !important; }
.canvas pre { text-align: left; font: 12.5px/1.5 var(--mono); color: var(--muted); margin: 0; white-space: pre-wrap; }
.note { font: 12.5px/1.5 var(--mono); color: var(--warn); margin: 0 0 10px; text-align: left; }
.caption { color: var(--muted); font-size: 14px; margin: 8px 0 0; }

.excerpt { border: 1px solid var(--code-line); border-radius: 10px; overflow: hidden; margin: 0 0 18px; background: var(--code-bg); }
.excerpt header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--code-line); }
.excerpt header b { color: #f1f6fd; font-size: 14.5px; }
.excerpt header a, .excerpt header span { font: 12px/1.4 var(--mono); color: #8fbdf5; overflow-wrap: anywhere; }
.excerpt pre { margin: 0; padding: 12px 0; overflow-x: auto; font: 12.5px/1.6 var(--mono); color: var(--code-ink); tab-size: 2; }
.excerpt .ln { display: block; padding: 0 16px 0 0; white-space: pre; }
.excerpt .ln::before { content: attr(data-n); display: inline-block; width: 52px; padding-right: 14px; text-align: right; color: var(--code-num); user-select: none; }
.excerpt p { margin: 0; padding: 11px 14px; border-top: 1px solid var(--code-line); color: #b9c8de; font-size: 14.5px; }
.excerpt p code { background: rgba(120,170,240,.16); color: #cfe3ff; }
ul.plain { margin: 0 0 12px; padding-left: 20px; }
ul.plain li { margin-bottom: 6px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid .card { margin: 0; }
.grid .card p { color: var(--muted); margin: 0; }
.steps { counter-reset: t; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: t; position: relative; padding: 14px 0 14px 46px; border-bottom: 1px solid var(--line); font-size: 17px; }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(t, decimal-leading-zero); position: absolute; left: 0; top: 17px; font: 600 13px var(--mono); color: var(--accent); }
footer { margin-top: 56px; padding: 28px 0 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; }
footer ul { padding-left: 18px; margin: 8px 0 14px; }
footer .gen { font: 12px var(--mono); }
@media print { nav { display: none; } .card, .excerpt { break-inside: avoid; } }
</style>

t 70%", "Two model calls: write a `<state_snapshot>` in XML, then critique and rewrite it. The snapshot is inserted as a user message followed by a fixed model acknowledgement", "Empty summary: nothing changes. Result larger than before: discarded, and later automatic attempts only truncate tool outputs without calling the summariser"]}]}, "deep_dives": [{"repo": "gemini-cli", "headline": "Truncate, split, snapshot, verify, and reject if it grew", "how_it_works": ["`GeminiClient` calls `tryCompressChat` at the start of every turn, before the model is called. The service first decides whether to act at all: it takes the token count of the last prompt and compares it with the threshold times the model's token limit. The default threshold is 0.5, so compression starts at half the context window, not at the edge. A user-run compress command sets `force` and skips this check.", "Before summarising anything, it makes a cheap pass called `truncateHistoryToBudget`. Walking from newest to oldest, it lets tool responses use up to 50,000 tokens in full. Older large tool responses past that budget are cut to their last 30 lines and the full output is saved to a file.", "Then it picks the split point. `findCompressSplitPoint` measures each message by its JSON length and looks for the first position, after 70% of the characters, that is a user message which is not a tool response. Splitting only there means a tool call is never separated from its result. If no such point exists, it compresses everything, but only when the last message is a model message with no pending tool call.", "The older part is sent to a model with a dedicated system prompt that asks for a `<state_snapshot>` with fixed sections: overall goal, active constraints, key knowledge, artifact trail, file system state, recent actions and task state. If an earlier snapshot is already in the history, the instruction is to merge it into the new one. A second call then hands the model its own snapshot and asks it to critically evaluate what it left out and produce an improved version.", "The new history is the snapshot as a user message, a fixed model reply, and the kept recent turns. The service counts the tokens of that new history. If the count is higher than before, the result is discarded and the client sets a flag: from then on, automatic attempts skip the summariser and rely on tool-output truncation alone. On success, the client starts a fresh chat session with the new history and emits a `ChatCompressed` event."], "diagram": {"caption": "Two exits return the history unchanged; one failure switches later attempts to truncation only.", "mermaid": "flowchart TB\n  turn[\"Start of a turn<br/>tryCompressChat\"]:::external --> chk{\"Tokens at or above<br/>50 percent of limit?\"}:::component\n  chk -->|\"no\"| noop[\"No change\"]:::store\n  chk -->|\"yes, or forced\"| trunc[\"truncateHistoryToBudget<br/>trim old tool outputs\"]:::component\n  trunc --> failed{\"Summariser failed<br/>earlier?\"}:::component\n  failed -->|\"yes\"| tonly[\"Keep truncation only<br/>CONTENT_TRUNCATED\"]:::store\n  failed -->|\"no\"| split[\"findCompressSplitPoint<br/>keep newest 30 percent\"]:::component\n  split --> snap[\"Model writes<br/>state_snapshot\"]:::system\n  snap --> verify[\"Model critiques<br/>and rewrites it\"]:::system\n  verify --> count{\"New history<br/>smaller?\"}:::component\n  count -->|\"yes\"| done[\"New chat session<br/>COMPRESSED\"]:::store\n  count -->|\"no\"| flag[\"Discard result<br/>set failure flag\"]:::queue\n"}, "key_parts": [{"name": "ChatCompressionService.compress", "path": "packages/core/src/context/chatCompressionService.ts", "role": "The whole procedure: threshold check, truncation, split, two model calls, size guard", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "DEFAULT_COMPRESSION_TOKEN_THRESHOLD", "path": "packages/core/src/context/chatCompressionService.ts", "role": "0.5: the fraction of the model's token limit at which compression starts", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "COMPRESSION_PRESERVE_THRESHOLD", "path": "packages/core/src/context/chatCompressionService.ts", "role": "0.3: the fraction of recent history kept verbatim", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "COMPRESSION_FUNCTION_RESPONSE_TOKEN_BUDGET", "path": "packages/core/src/context/chatCompressionService.ts", "role": "50,000 tokens of tool responses kept in full before older ones are truncated", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "findCompressSplitPoint", "path": "packages/core/src/context/chatCompressionService.ts", "role": "Chooses a cut that never separates a tool call from its response", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts"}, {"name": "getCompressionPrompt", "path": "packages/core/src/prompts/snippets.ts", "role": "The summariser's system prompt and the snapshot's XML structure", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/prompts/snippets.ts"}, {"name": "GeminiClient.tryCompressChat", "path": "packages/core/src/core/client.ts", "role": "Calls the service each turn, applies the result and remembers a failed attempt", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts"}, {"name": "compressCommand", "path": "packages/cli/src/ui/commands/compressCommand.ts", "role": "The manual command, which calls `tryCo ontent) => JSON.stringify(content).length);\n  const totalCharCount = charCounts.reduce((a, b) => a + b, 0);\n  const targetCharCount = totalCharCount * fraction;\n\n  let lastSplitPoint = 0; // 0 is always valid (compress nothing)\n  let cumulativeCharCount = 0;\n  for (let i = 0; i < contents.length; i++) {\n    const content = contents[i];\n    if (\n      content.role === 'user' &&\n      !content.parts?.some((part) => !!part.functionResponse)\n    ) {\n      if (cumulativeCharCount >= targetCharCount) {\n        return i;\n      }\n      lastSplitPoint = i;\n    }\n    cumulativeCharCount += charCounts[i];\n  }\n\n  // We found no split points after targetCharCount.\n  // Check if it's safe to compress everything.\n  const lastContent = contents[contents.length - 1];\n  if (\n    lastContent?.role === 'model' &&\n    !lastContent?.parts?.some((part) => part.functionCall)\n  ) {\n    return contents.length;\n  }\n\n  // Can't compress everything so just compress at last splitpoint.\n  return lastSplitPoint;\n}", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L282-L322"}, {"path": "packages/core/src/context/chatCompressionService.ts", "start": 587, "end": 613, "expect": "state_snapshot", "title": "First call: write the snapshot", "note": "If a snapshot from an earlier compression is present, the model is told to fold it into the new one.", "code": "    const hasPreviousSnapshot = historyForSummarizer.some((c) =>\n      c.parts?.some((p) => p.text?.includes('<state_snapshot>')),\n    );\n\n    const anchorInstruction = hasPreviousSnapshot\n      ? 'A previous <state_snapshot> exists in the history. You MUST integrate all still-relevant information from that snapshot into the new one, updating it with the more recent events. Do not lose established constraints or critical knowledge.'\n      : 'Generate a new <state_snapshot> based on the provided history.';\n\n    const summaryResponse = await config.getBaseLlmClient().generateContent({\n      modelConfigKey: { model: modelStringToModelConfigAlias(model) },\n      contents: [\n        ...historyForSummarizer,\n        {\n          role: 'user',\n          parts: [\n            {\n              text: `${anchorInstruction}\\n\\nFirst, reason in your scratchpad. Then, generate the updated <state_snapshot>.`,\n            },\n          ],\n        },\n      ],\n      systemInstruction: { text: getCompressionPrompt(config) },\n      promptId,\n      // TODO(joshualitt): wire up a sensible abort signal,\n      abortSignal: abortSignal ?? new AbortController().signal,\n      role: LlmRole.UTILITY_COMPRESSOR,\n    });", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L587-L613"}, {"path": "packages/core/src/context/chatCompressionService.ts", "start": 616, "end": 645, "expect": "Critically evaluate", "title": "Second call: the snapshot checks itself", "note": "If the second call returns nothing, the first summary is used.", "code": "    // Phase 3: The \"Probe\" Verification (Self-Correction)\n    // We perform a second lightweight turn to ensure no critical information was lost.\n    const verificationResponse = await config\n      .getBaseLlmClient()\n      .generateContent({\n        modelConfigKey: { model: modelStringToModelConfigAlias(model) },\n        contents: [\n          ...historyForSummarizer,\n          {\n            role: 'model',\n            parts: [{ text: summary }],\n          },\n          {\n            role: 'user',\n            parts: [\n              {\n                text: 'Critically evaluate the <state_snapshot> you just generated. Did you omit any specific technical details, file paths, tool results, or user constraints mentioned in the history? If anything is missing or could be more precise, generate a FINAL, improved <state_snapshot>. Otherwise, repeat the exact same <state_snapshot> again.',\n              },\n            ],\n          },\n        ],\n        systemInstruction: { text: getCompressionPrompt(config) },\n        promptId: `${promptId}-verify`,\n        role: LlmRole.UTILITY_COMPRESSOR,\n        abortSignal: abortSignal ?? new AbortController().signal,\n      });\n\n    const finalSummary = (\n      getResponseText(verificationResponse)?.trim() || summary\n    ).trim();", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/chatCompressionService.ts#L616-L645"}, {"path": "packages/core/src/prompts/snippets.ts", "start": 926, "end": 968, "expect": "<overall_goal>", "title": "What the snapshot must contain", "note": "The structure continues with a task state section listing done, in-progress and to-do steps.", "code": "The structure MUST be as follows:\n\n<state_snapshot>\n    <overall_goal>\n        <!-- A single, concise sentence describing the user's high-level objective. -->\n    <\/overall_goal>\n\n    <active_constraints>\n        <!-- Explicit constraints, preferences, or technical rules established by the user or discovered during development. -->\n        <!-- Example: \"Use tailwind for styling\", \"Keep functions under 20 lines\", \"Avoid modifying the 'legacy/' directory.\" -->\n    <\/active_constraints>\n\n    <key_knowledge>\n        <!-- Crucial facts and technical discoveries. -->\n        <!-- Example:\n         - Build Command: \\`npm run build\\`\n         - Port 3000 is occupied by a background process.\n         - The database uses CamelCase for column names.\n        -->\n    <\/key_knowledge>\n\n    <artifact_trail>\n        <!-- Evolution of critical files and symbols. What was changed and WHY. Use this to track all significant code modifications and design decisions. -->\n        <!-- Example:\n         - \\`src/auth.ts\\`: Refactored 'login' to 'signIn' to match API v2 specs.\n         - \\`UserContext <script>

      var u = safeUrl(r.url);

    })),
    h("p", { class: "meta" }, raw("analysed " + (meta.analysed_at || "") + " · each repository pinned to one commit, listed at the end"))

  sec.appendChild(h("div", { class: "card tablewrap" }, h("table", null,
    h("thead", null, h("tr", null, h("th", null, ""), (comp.dimensions || []).map(function (d) { return h("th", null, raw(d)); }))),
    h("tbody", null, (comp.rows || []).map(function (row) {
      var r = byId[row.repo] || {};

        h("td", { class: "who" }, raw(r.id || row.repo), h("br"), h("span", { class: "tag " + r.verdict }, raw(VERDICT[r.verdict] || ""))),
        (row.cells || []).map(function (c) { return h("td", null, c); }));
    })))));

          h("span", { class: "tag plain" }, raw(r.kind || "")), r.license ? h("span", { class: "tag plain" }, raw(r.license)) : null),
        h("h3", null, d.headline)),

    }

  });

  if (hasDiffs) {
    sec = section("differences", next(), "Where they differ, and why", null);
    sec.appendChild(h("div", { class: "grid" }, data.differences.map(function (x) {

  sec.appendChild(h("div", { class: "card" }, h("ol", { class: "steps" }, (data.build_your_own || []).map(function (t) { return h("li", null, t); }))));

    })),

    ]).map(function (l) { return h("li", null, l); })),

      labelTextColor: v("--ink"), loopTextColor: v("--ink"), noteBkgColor: v("--warn-soft"), noteTextColor: v("--ink"), noteBorderColor: v("--d-group-line"),

    },

  canvases.reduce(function (chain, c, i) {

      return window.mermaid.render("aa-diagram-" + i, code).then(function (out) {
        c[0].innerHTML = out.svg;

        fail(c[0], "This diagram could not be rendered: " + String(err && err.message || err).split("\n")[0]);
        var stray = document.getElementById("daa-diagram-" + i); if (stray) stray.remove();
      });
