<script type="application/json" id="aa-data">{"meta": {"question": "How does Gemini CLI implement memory: what stays in context, what is saved to disk, and is a semantic database used?", "title": "Memory", "slug": "memory", "analysed_at": "2026-10-04", "hook": "No vector database. Memory is markdown files, and the design question is where each file enters the prompt.", "site_url": "https://antriksh29071989.github.io/agent-anatomy/reports/memory/"}, "answer": "Gemini CLI's memory is plain markdown files, each read in full [^readwhole]. Three tiers decide where each file enters the conversation: global and private project memory go in the system instruction [^sysmem], project and extension files go in the first user message [^sessionmem], and files in subdirectories are appended to a tool's result when that folder is first touched [^jitappend]. The model saves a memory by editing one of these files with its ordinary file tools [^notool]. No semantic or vector database was found.", "citations": {"tiers": {"repo": "gemini-cli", "path": "packages/core/src/utils/environmentContext.ts", "start": 62, "end": 66, "claim": "A comment describes three tiers: tier 1 (global) in the system instruction only, tier 2 (extension and project) in the first user message, and tier 3 (subdirectory) in tool output, and the session memory is read at this point.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/utils/environmentContext.ts#L62-L66"}, "created": {"repo": "gemini-cli", "path": "packages/core/src/config/config.ts", "start": 1563, "end": 1564, "claim": "During initialisation a `MemoryContextManager` is created and refreshed.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/config/config.ts#L1563-L1564"}, "refresh": {"repo": "gemini-cli", "path": "packages/core/src/context/memoryContextManager.ts", "start": 38, "end": 47, "claim": "`refresh` clears the record of loaded files, discovers the memory paths, loads their contents and categorises them.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/memoryContextManager.ts#L38-L47"}, "discover": {"repo": "gemini-cli", "path": "packages/core/src/context/memoryContextManager.ts", "start": 49, "end": 65, "claim": "Four sets of paths are discovered: global, extension, environment (only when the folder is trusted) and user project memory.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/memoryContextManager.ts#L49-L65"}, "filenames": {"repo": "gemini-cli", "path": "packages/core/src/tools/memoryTool.ts", "start": 11, "end": 12, "claim": "The default context filename is `GEMINI.md` and the project memory index filename is `MEMORY.md`.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/tools/memoryTool.ts#L11-L12"}, "globalpath": {"repo": "gemini-cli", "path": "packages/core/src/utils/memoryDiscovery.ts", "start": 317, "end": 324, "claim": "Global memory files are looked for in the Gemini directory under the user's home directory.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/utils/memoryDiscovery.ts#L317-L324"}, "userproject": {"repo": "gemini-cli", "path": "packages/core/src/utils/memoryDiscovery.ts", "start": 342, "end": 355, "claim": "User project memory prefers the `MEMORY.md` index in the project memory directory, and returns it alone when it is readable.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/utils/memoryDiscovery.ts#L342-L355"}, "legacy": {"repo": "gemini-cli", "path": "packages/core/src/utils/memoryDiscovery.ts", "start": 356, "end": 372, "claim": "If the index is not readable, it falls back to legacy context files in the same directory.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/utils/memoryDiscovery.ts#L356-L372"}, "memdir": {"repo": "gemini-cli", "path": "packages/core/src/config/storage.ts", "start": 332, "end": 338, "claim": "The project memory directory is a `memory` folder inside the project's temp directory.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/config/storage.ts#L332-L338"}, "envpaths": {"repo": "gemini-cli", "path": "packages/core/src/utils/memoryDiscovery.ts", "start": 405, "end": 422, "claim": "For each trusted root, the upward search runs from that root to a ceiling, which is the project root found from the boundary markers (by default `.git`) or the trusted root itself if none is found.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/utils/memoryDiscovery.ts#L405-L422"}, "upward": {"repo": "gemini-cli", "path": "packages/core/src/utils/memoryDiscovery.ts", "start": 480, "end": 508, "claim": "The upward search checks each directory for context files, puts what it finds in front of the list, and moves to the parent until it reaches the stop directory, the filesystem root or the global Gemini directory.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/utils/memoryDiscovery.ts#L480-L508"}, "extension": {"repo": "gemini-cli", "path": "packages/core/src/utils/memoryDiscovery.ts", "start": 383, "end": 390, "claim": "Extension memory is the context files of active extensions.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/utils/memoryDiscovery.ts#L383-L390"}, "untrusted": {"repo": "gemini-cli", "path": "packages/core/src/context/memoryContextManager.ts", "start": 132, "end": 134, "claim": "Proj 575, "claim": "The rendered memory sections are wrapped in a `<loaded_context>` block preceded by a horizontal rule, and nothing is rendered when there are no sections.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/prompts/snippets.ts#L574-L575"}}, "repos": [{"id": "gemini-cli", "repo": "google-gemini/gemini-cli", "commit": "fb972b2f87fe7d5b06d37eac711490162d98de2c", "commit_date": "2026-10-02", "kind": "product", "language": "TypeScript", "license": "Apache-2.0", "what": "Google's terminal coding agent", "verdict": "implements", "summary": "File-based memory managed by a `MemoryContextManager` [^created]: it discovers four sets of markdown files [^discover] and delivers them in three tiers [^tiers], with writes done as ordinary file edits [^notool].", "url": "https://github.com/google-gemini/gemini-cli"}], "comparison": {"dimensions": ["In the context window", "On disk, loaded at start", "On disk, loaded on demand", "How memory is written", "Semantic database"], "rows": [{"repo": "gemini-cli", "cells": ["The conversation itself, held in the chat object [^history], plus whatever the three tiers have loaded [^tiers]", "Global `GEMINI.md` under the home directory [^globalpath], the private `MEMORY.md` index for the project [^userproject], and `GEMINI.md` files from the workspace up to the project root [^envpaths], plus active extensions' context files [^extension]", "`GEMINI.md` files in subdirectories, discovered when a file tool touches that folder [^jit] and appended to the tool result [^jitappend]", "The model edits the markdown files with its edit and write tools; there is no memory tool [^notool]. An experimental background extractor is off by default, and its setting describes its output as patches held for review [^autooff]", "None found"]}]}, "deep_dives": [{"repo": "gemini-cli", "headline": "Markdown files, three delivery tiers, and writes that are just file edits", "how_it_works": ["Memory here is a set of markdown files. At start-up the configuration creates a `MemoryContextManager` and refreshes it [^created]. A refresh clears its record of what is loaded, discovers the files, reads them and sorts them into categories [^refresh]. It looks in four places: global, extension, the workspace (only in a trusted folder) and the user's private project memory [^discover].", "The file names are `GEMINI.md` for instructions and `MEMORY.md` for the private index [^filenames]. Global memory is in the Gemini directory under the user's home [^globalpath]. Private project memory is the `MEMORY.md` index in a per-project memory directory [^userproject], which is a `memory` folder inside the project's temp directory [^memdir]; an older file name is used as a fallback [^legacy]. Project files are found by walking up from each workspace root to the project root, marked by `.git` by default [^envpaths], collecting a context file at each level [^upward]. Each file is read in full [^readwhole] and joined to the others between lines naming its path; empty files are dropped [^concat].", "The tiers are about where the text goes, as a comment in the code spells out [^tiers]. Tier 1 is the system instruction: global memory, plus the private project memory when it has content [^sysmem], built into the system prompt [^sysprompt] under their own tags [^render]. Tier 2 is the first user message: extension and project files, wrapped in `<loaded_context>` [^sessionmem].", "Tier 3 is loaded on demand. When a file tool touches a path, it asks for context for that path [^jit]. The search starts in the file's own folder and walks up to the project ceiling [^jitstart], skips every file that is already loaded [^jitskip], and marks the new ones as loaded [^jitmark]. Whatever it finds is appended to the tool's result between two marker lines [^jitappend]. The read-file tool [^jitread] and the ls tool [^jitls] both do this.", "Saving a memory is not a special operation. The prompt tells the model to edit the markdown files directly and says there is no `save_memory` tool [^notool]. It names four destinations: the project's `GEMINI.md` and subdirectory `GEMINI.md` files [^projecttier], the private project memory [^privatetier] and the global personal memory [^globaltier]. The routing rules are strict: one tier per fact, ask when unsure, never duplicate [^routing]. A refresh command re-reads the files and updates the system instruction [^reload].", "There is also an experimental background path, off by default [^autooff] and started only when enabled [^autostart]. It reads past sessions from the chats directory [^autodirs], does not run extraction if another instance holds the lock [^lock] or if the last run was under 30 minutes ago [^throttle][^autoconst], and only considers sessions that are not subagent sessions, have been idle for 3 hours and have at least 10 user messages [^eligible][^autoconst]. An extraction agent then runs over them [^extractagent][^extractrun]. The setting's description says every change is written as a patch file under an inbox folder and nothing is applied until approved [^autooff]; the service also detects new skills created in the skills directory [^skillscreated]."], "diagram": {"caption": "Memory files on the left, the three places they enter the conversation on the right [^tiers].", "mermaid": "flowchart LR\n  g[(\"Global GEMINI.md<br/>home directory\")]:::store\n  p[(\"Private MEMORY.md<br/>per project\")]:::store\n  e[(\"Extension context files\")]:::store\n  r[(\"Project GEMINI.md<br/>workspace up to root\")]:::store\n  s[(\"Subdirectory GEMINI.md\")]:::store\n  t1[\"Tier 1<br/>system instruction\"]:::system\n  t2[\"Tier 2<br/>first user message\"]:::system\n  t3[\"Tier 3<br/>tool result\"]:::system\n  m[\"Model\"]:::external\n  g --> t1\n  p --> t1\n  e --> t2\n  r --> t2\n  s -->|\"when a tool touches the folder\"| t3\n  t1 --> m\n  t2 --> m\n  t3 --> m\n  m -.->|\"edits files to save a memory\"| p\n"}, "key_parts": [{"name": "MemoryContextManager", "path": "packages/core/src/context/memoryContextManager.ts", "role": "Discovers, loads and categorises memory files; serves just-in-time context", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/memoryContextManager.ts"}, {"name": "getSystemInstructionMemory", "path": "packages/core/src/config/config.ts", "role": "Tier 1: what goes in the system instruction", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/config/config.ts"}, {"name": "getSessionMemory", "path": "packages/core/src/config/config.ts", "role": "Tier 2: what goes in the first user message", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/config/config.ts"}, {"name": "discoverJitContext", "path": "packages/core/src/tools/jit-context.ts", "role": "Tier 3: called by file tools to fetch and append subdirectory context", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/tools/jit-context.ts"}, {"name": "memoryDiscovery", "path": "packages/core/src/utils/memoryDiscovery.ts", "role": "Finds the files for each tier, including the upward and just-in-time searches", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/utils/memoryDiscovery.ts"}, {"name": "toolUsageRememberingFacts", "path": "packages/core/src/prompts/snippets.ts", "role": "The prompt section that tells the model where to write each kind of memory", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/prompts/snippets.ts"}, {"name": "startMemoryService", "path": "packages/core/src/services/memoryService.ts", "role": "The experimental background extractor over past sessions", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/memoryService.ts"}, {"name": "ChatRecordingService", "path": "packages/core/src/services/chatRecordingService.ts", "role": "Appends every session to a JSONL file on disk", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/chatRecordingService.ts"}], "excerpts": [{"path": "packages/core/src/utils/environmentContext.ts", "start": 62, "end": 66, "expect": "Tiered context model", "title": "The three tiers, in the authors' words", "code": "  // Tiered context model (see issue #11488):\n  // - Tier 1 (global): system instruction only\n  // - Tier 2 (extension + project): first user message (here)\n  // - Tier 3 (subdirectory): tool output (JIT)\n  const environmentMemory = config.getSessionMemory();", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/utils/environmentContext.ts#L62-L66"}, {"path": "packages/core/src/config/config.ts", "start": 2591, "end": 2608, "expect": "getSystemInstructionMemory", "title": "Tier 1: the system instruction", "note": "Private project memory joins global memory here when it has content [^sysmem].", "code": "  /**\n   * Returns Tier 1 memory for the system instruction. Global memory and user\n   * project memory go in the system instruction; extension and project memory\n   * are placed in the first user message instead, per the tiered context model.\n   * User project memory is in Tier 1 so mid-session saves are reflected via\n   * system instruction updates.\n   */\n  getSystemInstructionMemory(): string | HierarchicalMemory {\n    if (this.memoryContextManager) {\n      const global = this.memoryContextManager.getGlobalMemory();\n      const userProjectMemory =\n        this.memoryContextManager.getUserProjectMemory();\n      if (userProjectMemory?.trim()) {\n        return { global, userProjectMemory };\n      }\n      return global;\n    }\n    return this.userMemory;", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/config/config.ts#L2591-L2608"}, {"path": "packages/core/src/config/config.ts", "start": 2611, "end": 2635, "expect": "getSessionMemory", "title": "Tier 2: the first user message", "note": "Extension and project files are wrapped in tags inside `<loaded_context>` [^sessionmem].", "code": "  /**\n   * Returns Tier 2 memory (extension + project) for injection into the first\n   * user message.\n   */\n  getSessionMemory(options?: { includeExtensionContext?: boolean }): string {\n    if (!this.memoryContextManager) {\n      return '';\n    }\n    const sections: string[] = [];\n    const includeExtensionContext = options?.includeExtensionContext ?? true;\n    const extension = includeExtensionContext\n      ? this.memoryContextManager.getExtensionMemory()\n      : '';\n    const project = this.memoryContextManager.getEnvironmentMemory();\n    if (extension?.trim()) {\n      sections.push(\n        `<extension_context>\\n${extension.trim()}\\n<\/extension_context>`,\n      );\n    }\n    if (project?.trim()) {\n      sections.push(`<project_context>\\n${project.trim()}\\n<\/project_context>`);\n    }\n    if (sections.length === 0) return '';\n    return `\\n<loaded_context>\\n${sections.join('\\n')}\\n<\/loaded_context>`;\n  }", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/config/config.ts#L2611-L2635"}, {"path": "packages/core/src/context/memoryContextManager.ts", "start": 141, "end": 172, "expect": "discoverContext", "title": "Tier 3: context loaded when a path is touched", "note": "Nothing is loaded in an untrusted folder, and already-loaded paths are passed in [^jitgate].", "code": "  async discoverContext(\n    accessedPath: string,\n    trustedRoots: string[],\n  ): Promise<string> {\n    if (!this.config.isTrustedFolder()) {\n      return '';\n    }\n    const result = await loadJitSubdirectoryMemory(\n      accessedPath,\n      trustedRoots,\n      this.loadedPaths,\n      this.loadedFileIdentities,\n      this.config.getMemoryBoundaryMarkers(),\n    );\n\n    if (result.files.length === 0) {\n      return '';\n    }\n\n    const newFilePaths = result.files.map((f) => f.path);\n    this.markAsLoaded(newFilePaths);\n\n    // Cache identities for newly loaded files\n    if (result.fileIdentities) {\n      for (const identity of result.fileIdentities) {\n        this.loadedFileIdentities.add(identity);\n      }\n    }\n    return concatenateInstructions(\n      result.files.map((f) => ({ filePath: f.path, content: f.content })),\n    );\n  }", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/context/memoryContextManager.ts#L141-L172"}, {"path": "packages/core/src/services/memoryService.ts", "start": 554, "end": 568, "expect": "shouldProcessConversation", "title": "Which past sessions the background extractor will read", "note": "Subagent sessions, recently active sessions and short sessions are skipped [^eligible].", "code": "function shouldProcessConversation(\n  parsed: ConversationRecord & { userMessageCount?: number },\n): boolean {\n  // Skip subagent sessions\n  if (parsed.kind === 'subagent') return false;\n\n  // Skip sessions that are still active (not idle for 3+ hours)\n  const lastUpdated = getTimestampMs(parsed.lastUpdated);\n  if (Date.now() - lastUpdated < MIN_IDLE_MS) return false;\n\n  // Skip sessions with too few user messages\n  if (getUserMessageCount(parsed) < MIN_USER_MESSAGES) return false;\n\n  return true;\n}", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/memoryService.ts#L554-L568"}], "gotchas": ["Each file is read in full [^readwhole], and the prompt asks the model to keep the private memory file concise and use it as an index [^privatetier].", "In an untrusted folder the project's files are not loaded at start [^untrusted] and nothing is discovered on demand [^jitgate].", "A subdirectory file is delivered once: later touches of the same folder find it already loaded [^jitskip].", "Every session is also written to disk, one JSON line per record [^record], under the project's chats directory [^recorddir]. That is a transcript for resuming and for the background extractor [^autodirs], not something loaded into new conversations by the tiers.", "The background extractor is experimental and off by default; its setting describes the output as held for approval [^autooff].", "An embedding method exists on the model client [^embed], but no code was found that calls it."], "searched": ["Searched `packages/core/src` and `packages/cli/src` (excluding tests) for: embedding, vector store, vector db, vector search, sqlite, lancedb, chroma, pinecone, faiss, pgvector, cosine. The only relevant hit is the unused `generateEmbedding` method.", "Searched all packages for callers of `generateEmbedding`: none outside its own definition.", "Checked the `dependencies` of the core and cli packages for a vector or embedded database: none of sqlite, lancedb, chroma, faiss, hnsw found.", "Searched the tool names and registry for a `save_memory` tool: not found; the prompt itself says there is none."]}], "build_your_own": ["Start with files. Markdown that a person can read, edit and commit covers most of what an agent needs to remember, with no extra infrastructure.", "Decide where each kind of memory enters the prompt. Stable, personal facts suit the system instruction; project context suits the first message; narrow context can wait until it is needed.", "Load subdirectory instructions when a tool touches that folder, and deliver each file once.", "Keep one home per fact. Tell the model which file each kind of fact belongs in and to ask when it is unsure, or the same note ends up in three places.", "Let the model write memory with the file tools it already has; a dedicated memory tool is optional.", "Do not load project files from a folder the user has not trusted.", "If you add automatic extraction from past sessions, gate it: wait until a session is idle, require some length, and hold the result for the user to approve."], "implementation": {"title": "File-based memory in about 130 lines of Python", "intro": "One class and four small functions, standard library only. It follows Gemini CLI's design: find the files for each tier, deliver tier 1 for the system instruction and tier 2 for the first message, and discover tier 3 when a tool touches a path. A write is an ordinary file edit followed by `refresh()`.", "dir": "impl", "files": [{"name": "file_memory.py", "code": "\"\"\"File-based agent memory in three tiers: a small reference implementation.\n\nIt follows the design of Gemini CLI's memory, described with source citations\nin the report this file belongs to. Memory is plain markdown files. Nothing is\nembedded or searched: files are loaded whole, and what differs is *where* each\none enters the conversation.\n\n  Tier 1  global + private project memory   -> the system instruction\n  Tier 2  extension + project context files -> the first user message\n  Tier 3  subdirectory context files        -> appended to a tool's result,\n                                               the first time that folder is touched\n\nWritten from scratch for teaching. It is not code from that project.\n\"\"\"\nimport os\n\nCONTEXT_FILENAME = \"GEMINI.md\"          # instruction files, at any directory level\nMEMORY_INDEX_FILENAME = \"MEMORY.md\"     # the private per-project memory index\nGLOBAL_DIR = \".gemini\"                  # under the user's home directory\nJIT_PREFIX = \"\\n\\n--- Newly Discovered Project Context ---\\n\"\nJIT_SUFFIX = \"\\n--- End Project Context ---\"\n\n\ndef find_project_root(start, markers=(\".git\",)):\n    \"\"\"The nearest ancestor of `start` that contains a boundary marker, or None.\"\"\"\n    current = os.path.abspath(start)\n    while True:\n        if any(os.path.exists(os.path.join(current, m)) for m in markers):\n            return current\n        parent = os.path.dirname(current)\n        if parent == current:\n            return None\n        current = parent\n\n\ndef find_upward(start_dir, stop_dir):\n    \"\"\"Context files from `start_dir` up to `stop_dir`, outermost first.\"\"\"\n    found, current, stop = [], os.path.abspath(start_dir), os.path.abspath(stop_dir)\n    while True:\n        candidate = os.path.join(current, CONTEXT_FILENAME)\n        if os.path.isfile(candidate):\n            found.insert(0, candidate)\n        parent = os.path.dirname(current)\n        if current == stop or parent == current:\n            return found\n        current = parent\n\n\ndef read_all(paths):\n    \"\"\"Concatenate files, each between lines naming where it came from. Empty files are dropped.\"\"\"\n    out = []\n    for path in paths:\n        with open(path, encoding=\"utf-8\") as f:\n            text = f.read().strip()\n        if text:\n            out.append(f\"--- Context from: {path} ---\\n{text}\\n--- End of Context from: {path} ---\")\n    return \"\\n\\n\".join(out)\n\n\nclass MemoryStore:\n    def __init__(self, home, project_memory_dir, workspace_roots, trusted=True, extension_files=()):\n        self.home, self.project_memory_dir = home, project_memory_dir\n        self.roots, self.trusted, self.extension_files = list(workspace_roots), trusted, list(extension_files)\n        self.loaded = set()             # real paths already in the conversation\n        self.global_memory = self.user_project_memory = self.project_memory = self.extension_memory = \"\"\n        self.refresh()\n\n    def memory_paths(self):\n        \"\"\"Where each kind of memory lives. A write is an ordinary edit of one of these files.\"\"\"\n        return {\"global\": os.path.join(self.home, GLOBAL_DIR, CONTEXT_FILENAME),\n                \"private_project\": os.path.join(self.project_memory_dir, MEMORY_INDEX_FILENAME),\n                \"project\": [os.path.join(r, CONTEXT_FILENAME) for r in self.roots]}\n\n    def refresh(self):\n        \"\"\"Re-read every tier from disk. Call at start-up and after memory files change.\"\"\"\n        self.loaded.clear()\n        paths = self.memory_paths()\n        global_paths = [p for p in [paths[\"global\"]] if os.path.isfile(p)]\n        private = [p for p in [paths[\"private_project\"]] if os.path.isfile(p)]\n        if not private:                 # fall back to the older private file name\n            legacy = os.path.join(self.project_memory_dir, CONTEXT_FILENAME)\n            private = [legacy] if os.path.isfile(legacy) else []\n        project = []\n        if self.trusted:                # project files are only read in a trusted folder\n            for root in self.roots:\n                ceiling = find_project_root(root) or os.path.abspath(root)\n                project += [p for p in find_upward(root, ceiling) if p not in project]\n            project.sort()\n        extension = [p for p in self.extension_files if os.path.isfile(p)]\n        self.global_memory, self.user_project_memory = read_all(global_paths), read_all(private)\n        self.project_memory, self.extension_memory = read_all(project), read_all(extension)\n        self.loaded.update(os.path.realpath(p) for p in global_paths + private + project + extension)\n\n    def system_instruction_memory(self):\n        \"\"\"Tier 1: goes in the system instruction.\"\"\"\n        parts = []\n        if self.global_memory.strip():\n            parts.append(f\"<global_context>\\n{self.global_memory.strip()}\\n<\/global_context>\")\n        if self.user_project_memory.strip():\n            parts.append(f\"<user_project_memory>\\n{self.user_project_memory.strip()}\\n<\/user_project_memory>\")\n        return \"\\n\".join(parts)\n\n    def session_memory(self):\n        \"\"\"Tier 2: goes in the first user message.\"\"\"\n        sections = []\n        if self.extension_memory.strip():\n            sections.append(f\"<extension_context>\\n{self.extension_memory.strip()}\\n<\/extension_context>\")\n        if self.project_memory.strip():\n            sections.append(f\"<project_context>\\n{self.project_memory.strip()}\\n<\/project_context>\")\n        return f\"\\n<loaded_context>\\n{chr(10).join(sections)}\\n<\/loaded_context>\" if sections else \"\"\n\n    def discover_context(self, accessed_path):\n        \"\"\"Tier 3: context files between a path a tool just touched and the project ceiling.\"\"\"\n        if not self.trusted:\n            return \"\"\n        target = os.path.abspath(accessed_path)\n        roots = [os.path.abspath(r) for r in self.roots\n                 if target == os.path.abspath(r) or target.startswith(os.path.abspath(r) + os.sep)]\n        if not roots:\n            return \"\"                   # outside every workspace root\n        best_root = max(roots, key=len)                     # the deepest root containing the path\n        ceiling = find_project_root(best_root) or best_root\n        start = target if os.path.isdir(target) else os.path.dirname(target)\n        new = [p for p in find_upward(start, ceiling) if os.path.realpath(p) not in self.loaded]\n        self.loaded.update(os.path.realpath(p) for p in new)   # each file is delivered once\n        return read_all(new)\n\n\ndef append_jit_context(tool_output, context):\n    \"\"\"Attach newly discovered context to a tool's result; leave it alone if there is none.\"\"\"\n    return f\"{tool_output}{JIT_PREFIX}{context}{JIT_SUFFIX}\" if context else tool_output", "href": "impl/file_memory.py"}, {"name": "test_file_memory.py", "code": "\"\"\"Tests for file_memory.py. Run: python3 -m unittest -v\"\"\"\nimport os\nimport tempfile\nimport unittest\n\nfrom file_memory import JIT_PREFIX, MemoryStore, append_jit_context, find_upward\n\n\ndef write(path, text):\n    os.makedirs(os.path.dirname(path), exist_ok=True)\n    with open(path, \"w\", encoding=\"utf-8\") as f:\n        f.write(text)\n\n\nclass Base(unittest.TestCase):\n    def setUp(self):\n        self.tmp = tempfile.TemporaryDirectory()\n        t = os.path.realpath(self.tmp.name)\n        self.home, self.repo = os.path.join(t, \"home\"), os.path.join(t, \"repo\")\n        self.private = os.path.join(self.home, \".gemini\", \"tmp\", \"repo-hash\", \"memory\")\n        os.makedirs(os.path.join(self.repo, \".git\"))\n        os.makedirs(self.home)\n\n    def tearDown(self):\n        self.tmp.cleanup()\n\n    def store(self, **kw):\n        return MemoryStore(self.home, self.private, [self.repo], **kw)\n\n\nclass TierOne(Base):\n    def test_global_memory_goes_in_the_system_instruction(self):\n        write(os.path.join(self.home, \".gemini\", \"GEMINI.md\"), \"I prefer pytest.\")\n        s = self.store()\n        self.assertIn(\"<global_context>\", s.system_instruction_memory())\n        self.assertIn(\"I prefer pytest.\", s.system_instruction_memory())\n        self.assertEqual(s.session_memory(), \"\")\n\n    def test_private_project_memory_index_is_tier_one_too(self):\n        write(os.path.join(self.private, \"MEMORY.md\"), \"Local db runs on 5433.\")\n        self.assertIn(\"<user_project_memory>\", self.store().system_instruction_memory())\n\n    def test_memory_md_is_preferred_over_the_legacy_private_file(self):\n        write(os.path.join(self.private, \"MEMORY.md\"), \"new index\")\n        write(os.path.join(self.private, \"GEMINI.md\"), \"old private file\")\n        text = self.store().system_instruction_memory()\n        self.assertIn(\"new index\", text)\n        self.assertNotIn(\"old private file\", text)\n\n    def test_legacy_private_file_is_used_when_there_is_no_index(self):\n        write(os.path.join(self.private, \"GEMINI.md\"), \"old private file\")\n        self.assertIn(\"old private file\", self.store().system_instruction_memory())\n\n\n    def test_an_empty_private_memory_file_adds_nothing(self):\n        write(os.path.join(self.private, \"MEMORY.md\"), \"   \\n\")\n        self.assertEqual(self.store().system_instruction_memory(), \"\")\n\n\nclass TierTwo(Base):\n    def test_project_file_goes_in_the_first_user_message_not_the_system_instruction(self):\n        write(os.path.join(self.repo, \"GEMINI.md\"), \"We use tabs.\")\n        s = self.store()\n        self.assertIn(\"<project_context>\", s.session_memory())\n        self.assertIn(\"We use tabs.\", s.session_memory())\n        self.assertNotIn(\"We use tabs.\", s.system_instruction_memory())\n\n    def test_an_untrusted_folder_loads_no_project_memory(self):\n        write(os.path.join(self.repo, \"GEMINI.md\"), \"We use tabs.\")\n        self.assertEqual(self.store(trusted=False).session_memory(), \"\")\n\n    def test_upward_search_is_outermost_first_and_stops_at_the_project_root(self):\n        write(os.path.join(os.path.dirname(self.repo), \"GEMINI.md\"), \"above the repo\")\n        write(os.path.join(self.repo, \"GEMINI.md\"), \"root\")\n        write(os.path.join(self.repo, \"pkg\", \"GEMINI.md\"), \"pkg\")\n        found = find_upward(os.path.join(self.repo, \"pkg\"), self.repo)\n        self.assertEqual([os.path.relpath(p, self.repo) for p in found], [\"GEMINI.md\", os.path.join(\"pkg\", \"GEMINI.md\")])\n\n\n    def test_a_blank_project_file_adds_no_session_memory(self):\n        write(os.path.join(self.repo, \"GEMINI.md\"), \"\\n\\n\")\n        self.assertEqual(self.store().session_memory(), \"\")\n\n\nclass TierThree(Base):\n    def test_a_subdirectory_file_is_discovered_when_a_tool_touches_that_folder(self):\n        write(os.path.join(self.repo, \"src\", \"auth\", \"GEMINI.md\"), \"Auth rules.\")\n        s = self.store()\n        self.assertNotIn(\"Auth rules.\", s.session_memory())\n        context = s.discover_context(os.path.join(self.repo, \"src\", \"auth\", \"login.ts\"))\n        self.assertIn(\"Auth rules.\", context)\n        self.assertIn(JIT_PREFIX, append_jit_context(\"file contents\", context))\n\n    def test_each_file_is_delivered_only_once(self):\n        write(os.path.join(self.repo, \"src\", \"GEMINI.md\"), \"Src rules.\")\n        s = self.store()\n        self.assertIn(\"Src rules.\", s.discover_context(os.path.join(self.repo, \"src\", \"a.ts\")))\n        self.assertEqual(s.discover_context(os.path.join(self.repo, \"src\", \"b.ts\")), \"\")\n\n    def test_files_already_loaded_at_start_are_not_repeated(self):\n        write(os.path.join(self.repo, \"GEMINI.md\"), \"root rules\")\n        self.assertEqual(self.store().discover_context(os.path.join(self.repo, \"main.ts\")), \"\")\n\n    def test_a_file_that_does_not_exist_yet_uses_its_parent_folder(self):\n        write(os.path.join(self.repo, \"docs\", \"GEMINI.md\"), \"Docs rules.\")\n        self.assertIn(\"Docs rules.\", self.store().discover_context(os.path.join(self.repo, \"docs\", \"new.md\")))\n\n    def test_nothing_is_discovered_outside_the_workspace_or_when_untrusted(self):\n        write(os.path.join(self.repo, \"src\", \"GEMINI.md\"), \"Src rules.\")\n        self.assertEqual(self.store().discover_context(\"/etc/hosts\"), \"\")\n        self.assertEqual(self.store(trusted=False).discover_context(os.path.join(self.repo, \"src\", \"a.ts\")), \"\")\n\n    def test_an_empty_subdirectory_file_adds_nothing_to_the_tool_output(self):\n        write(os.path.join(self.repo, \"src\", \"GEMINI.md\"), \"\")\n        context = self.store().discover_context(os.path.join(self.repo, \"src\", \"a.ts\"))\n        self.assertEqual(append_jit_context(\"out\", context), \"out\")\n\n    def test_no_context_leaves_the_tool_output_unchanged(self):\n        self.assertEqual(append_jit_context(\"out\", \"\"), \"out\")\n\n\nclass Writing(Base):\n    def test_a_saved_memory_is_an_edited_file_and_shows_up_after_refresh(self):\n        s = self.store()\n        self.assertEqual(s.system_instruction_memory(), \"\")\n        write(s.memory_pat       actorBkg: v("--d-component"), actorBorder: v("--rule"), actorTextColor: v("--d-component-ink"), actorLineColor: v("--d-line"),
      signalColor: v("--ink"), signalTextColor: v("--ink"), labelBoxBkgColor: v("--sheet"), labelBoxBorderColor: v("--d-line"),
      labelTextColor: v("--ink"), loopTextColor: v("--ink"), noteBkgColor: v("--sheet"), noteTextColor: v("--ink"), noteBorderColor: v("--d-line"),
      activationBkgColor: v("--well"), activationBorderColor: v("--d-line")
    },
    flowchart: { curve: "basis", useMaxWidth: true, padding: 14, nodeSpacing: 46, rankSpacing: 54 },
    sequence: { useMaxWidth: true, mirrorActors: false, wrap: true }
  });
  canvases.reduce(function (chain, c, i) {
    return chain.then(function () {
      var code = c[1];
      if (/^\s*(flowchart|graph)\b/.test(code)) code += classDefs;
      return window.mermaid.render("aa-diagram-" + i, code).then(function (out) {
        c[0].innerHTML = out.svg;
      }).catch(function (err) {
        fail(c[0], "This diagram could not be rendered: " + String(err && err.message || err).split("\n")[0]);
        var stray = document.getElementById("daa-diagram-" + i); if (stray) stray.remove();
      });
    });
  }, Promise.resolve());
})();
</script>
