<script type="application/json" id="aa-data">{"meta": {"question": "How do production agents detect that they are stuck in a loop, and what do they do about it?", "title": "Loop detection", "slug": "loop-detection", "analysed_at": "2026-10-03", "hook": "Gemini CLI asks a model if the agent is looping. OpenHands matches patterns. LangGraph just counts steps.", "site_url": "https://antriksh29071989.github.io/agent-anatomy/reports/loop-detection/"}, "answer": "There is no single technique. Gemini CLI runs three detectors: hashed tool-call cycles [^g-cycle], repeated text [^g-contentdoc], and a periodic model-based check [^g-llmgate] that a second model is asked to confirm [^g-double]. OpenHands matches rule-based patterns over the recent event history [^o-scenarios]. Gemini CLI warns the model on a first detection [^g-turnstart][^g-recover], and OpenHands does so for repeated errors [^o-nudge]. LangGraph has no behavioural detection, only a step budget [^l-tick], and no loop detector was found in Codex.", "repos": [{"id": "gemini-cli", "repo": "google-gemini/gemini-cli", "commit": "fb972b2f87fe7d5b06d37eac711490162d98de2c", "commit_date": "2026-10-02", "kind": "product", "language": "TypeScript", "license": "Apache-2.0", "what": "Google's terminal coding agent", "verdict": "implements", "summary": "A dedicated `LoopDetectionService` with three detectors [^g-cycle][^g-contentdoc][^g-llmgate], a one-time recovery message [^g-recover], and a hard stop on the second detection [^g-turnstart].", "url": "https://github.com/google-gemini/gemini-cli"}, {"id": "openhands", "repo": "OpenHands/software-agent-sdk", "commit": "1b2b5c850b6a99d8b742bfe20d198d6167165ca2", "commit_date": "2026-10-03", "kind": "product", "language": "Python", "license": "MIT", "what": "The agent SDK and server behind OpenHands (the OpenHands/OpenHands repository is now the UI)", "verdict": "implements", "summary": "A `StuckDetector` that tests recent actions and observations against a set of stuck patterns [^o-scenarios], four of which are implemented [^o-stub]. It nudges the model on a repeated error [^o-nudge] and otherwise marks the conversation `STUCK` [^o-run].", "url": "https://github.com/OpenHands/software-agent-sdk"}, {"id": "langgraph", "repo": "langchain-ai/langgraph", "commit": "9a0394d88b2211f299dcd69df92db3480c69ee61", "commit_date": "2026-10-03", "kind": "framework", "language": "Python", "license": "MIT", "what": "Graph-based agent orchestration framework", "verdict": "delegates", "summary": "The runtime does not look at behaviour. It counts steps [^l-tick] and raises `GraphRecursionError` at the limit [^l-raise]; recognising an unproductive loop is left to the graph you write.", "url": "https://github.com/langchain-ai/langgraph"}, {"id": "codex", "repo": "openai/codex", "commit": "b172810921f89847cd310ecc496f9c901760e933", "commit_date": "2026-10-03", "kind": "product", "language": "Rust", "license": "Apache-2.0", "what": "OpenAI's terminal coding agent", "verdict": "absent", "summary": "No loop detector or step cap was found in the core turn loop at this commit. Follow-up is needed when the model asks for it or input is pending [^x-followup]; when it is needed the loop goes round again [^x-continue], and there is a branch for when it is not [^x-exit].", "url": "https://github.com/openai/codex"}], "comparison": {"dimensions": ["Approach", "What it watches", "Thresholds", "First response", "Hard stop"], "rows": [{"repo": "gemini-cli", "cells": ["Three detectors in one service: exact tool-call cycles [^g-cycle], repeated text [^g-contentdoc], and a model acting as judge [^g-llmgate]", "A hash of each tool call's name and arguments [^g-key]; 50-character chunks of streamed text [^g-contentconst]; the last 20 history entries [^g-llmconst]", "A cycle of length 1 to 5 repeated 5 times [^g-cycle][^g-toolthr]; a chunk seen 10 times close together [^g-contentthr]; the judge starts after 30 turns [^g-llmconst] and needs confidence of 0.9 or more [^g-conf]", "Injects a `Potential loop detected` message and lets the model continue [^g-recover]", "A second detection ends the turn with a `LoopDetected` event [^g-turnstart]. Separately, a send is bounded to 100 turns [^g-maxturns][^g-cap]"]}, {"repo": "openhands", "cells": ["Rule-based pattern matching over recent events [^o-scenarios]", "Actions, observations, errors and agent messages after the last user message, within a 20-event window [^o-window][^o-windowconst]", "4 identical action and observation pairs [^o-s1]; the same action erroring more than 3 times in a row [^o-s2][^o-streak]; 3 consecutive agent messages [^o-mono]; 6 for the alternating pattern [^o-thr]", "When the same action has errored exactly 3 times in a row, a nudge naming the tool and the latest error [^o-nudge][^o-streak]", "Status set to `STUCK` and the check returns True [^o-run]. Separately, a cap of 500 iterations per run [^o-defaults][^o-maxiter]"]}, {"repo": "langgraph", "cells": ["A step budget, no behavioural detection [^l-tick]", "The number of steps the graph has executed [^l-stop]", "`recursion_limit`, which defaults [^l-defaultuse] to 10007 or an environment variable's value [^l-default]", "The prebuilt ReAct agent answers `Sorry, need more steps to process this request.` [^l-sorry] when fewer than 2 steps remain and the model asked for tool calls [^l-more]", "`GraphRecursionError` when the step count passes the stop point [^l-tick][^l-raise]"]}, {"repo": "codex", "cells": ["None found", "Not applicable", "Not applicable", "Not applicable", "The turn loop goes round again when follow-up is needed [^x-followup][^x-continue]"]}]}, "deep_dives": [{"repo": "gemini-cli", "headline": "Three detectors, one warning, then a stop", "how_it_works": ["Every stream event passes through `addAndCheck` [^g-events]. For tool calls the service hashes the tool name plus its JSON arguments with SHA-256 [^g-key] and looks for a repeating cycle: any pattern of length 1 to 5 that has repeated 5 times in a row [^g-cycle][^g-toolthr]. That catches `A A A A A` and also `A B A B A B A B A B`.", "For model text, it works in 50-character chunks [^g-contentconst], hashes them, and flags a loop when identical chunks appear frequently within a short distance; detection is switched off inside code blocks [^g-contentdoc]. A chunk has to occur at least 10 times before its spacing is tested [^g-contentthr].", "Neither catches an agent that keeps doing slightly different unproductive things. So once a single prompt has run for 30 turns [^g-llmconst][^g-llmgate], the service periodically sends recent history to a model [^g-history]. If that model's confidence is below 0.9, nothing is reported [^g-below][^g-conf]. At 0.9 or above, a second model alias is asked to double-check [^g-double], and a loop is reported if it also reaches the threshold [^g-confirm]. If the second model is unavailable, the first model's verdict is used alone [^g-unavailable]. The interval between checks adapts between 5 and 15 turns [^g-interval]: the higher the last confidence, the sooner the next check [^g-adapt].", "The response is graduated. On the first detection `GeminiClient` clears the flag, injects a message telling the model a potential loop was detected, and continues [^g-recover], unless the turn budget is already used up, in which case it stops with `MaxSessionTurns` [^g-turnstart]. On the second detection it emits `LoopDetected` and ends the turn [^g-turnstart]."], "diagram": {"caption": "A first detection normally becomes a message to the model [^g-recover]; a second one stops the turn [^g-turnstart].", "mermaid": "flowchart TB\n  ev[\"Stream event\"]:::external --> svc[\"LoopDetectionService<br/>addAndCheck\"]:::system\n  svc -->|\"tool call\"| tc[\"Hash name and args<br/>look for a repeated cycle\"]:::component\n  svc -->|\"text\"| ct[\"Hash 50-char chunks<br/>count close repeats\"]:::component\n  ts[\"Turn start<br/>after 30 turns\"]:::external --> llm[\"Model judge<br/>second model double-checks\"]:::component\n  tc --> hit[\"Loop detected<br/>count goes up\"]:::queue\n  ct --> hit\n  llm --> hit\n  hit -->|\"first time\"| rec[\"Inject warning message<br/>continue the turn\"]:::component\n  hit -->|\"second time\"| stop[\"LoopDetected event<br/>turn ends\"]:::store\n"}, "key_parts": [{"name": "LoopDetectionService", "path": "packages/core/src/services/loopDetectionService.ts", "role": "All three detectors, their thresholds and state", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts"}, {"name": "GeminiClient", "path": "packages/core/src/core/client.ts", "role": "Calls the detector on each turn and event, and decides between recovery and stopping", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts"}, {"name": "LoopType", "path": "packages/core/src/telemetry/types.ts", "role": "Names the three kinds of loop for telemetry", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/telemetry/types.ts"}], "excerpts": [{"path": "packages/core/src/services/loopDetectionService.ts", "start": 29, "end": 66, "expect": "TOOL_CALL_LOOP_THRESHOLD = 5", "title": "The thresholds", "note": "Every number that decides when a loop is declared, in one place.", "code": "const TOOL_CALL_LOOP_THRESHOLD = 5;\nconst CONTENT_LOOP_THRESHOLD = 10;\nconst CONTENT_CHUNK_SIZE = 50;\nconst MAX_HISTORY_LENGTH = 5000;\n\n/**\n * The number of recent conversation turns to include in the history when asking the LLM to check for a loop.\n */\nconst LLM_LOOP_CHECK_HISTORY_COUNT = 20;\n\n/**\n * The number of turns that must pass in a single prompt before the LLM-based loop check is activated.\n */\nconst LLM_CHECK_AFTER_TURNS = 30;\n\n/**\n * The default interval, in number of turns, at which the LLM-based loop check is performed.\n * This value is adjusted dynamically based on the LLM's confidence.\n */\nconst DEFAULT_LLM_CHECK_INTERVAL = 10;\n\n/**\n * The minimum interval for LLM-based loop checks.\n * This is used when the confidence of a loop is high, to check more frequently.\n */\nconst MIN_LLM_CHECK_INTERVAL = 5;\n\n/**\n * The maximum interval for LLM-based loop checks.\n * This is used when the confidence of a loop is low, to check less frequently.\n */\nconst MAX_LLM_CHECK_INTERVAL = 15;\n\n/**\n * The confidence threshold above which the LLM is considered to have detected a loop.\n */\nconst LLM_CONFIDENCE_THRESHOLD = 0.9;\nconst DOUBLE_CHECK_MODEL_ALIAS = 'loop-detection-double-check';", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L29-L66"}, {"path": "packages/core/src/services/loopDetectionService.ts", "start": 313, "end": 349, "expect": "checkToolCallLoop", "title": "Detecting repeated tool calls, including cycles", "note": "`k` is the cycle length. For each `k` from 1 to 5 it checks whether the last `k` calls have repeated 5 times.", "code": "  private checkToolCallLoop(toolCall: { name: string; args: object }): boolean {\n    const key = this.getToolCallKey(toolCall);\n    this.toolCallHistory.push(key);\n\n    const maxRequiredLength = 5 * TOOL_CALL_LOOP_THRESHOLD;\n    if (this.toolCallHistory.length > maxRequiredLength) {\n      this.toolCallHistory = this.toolCallHistory.slice(-maxRequiredLength);\n    }\n\n    const n = this.toolCallHistory.length;\n    const R = TOOL_CALL_LOOP_THRESHOLD; // 5\n\n    // Check for repeating patterns of cycle length k from 1 to 5\n    for (let k = 1; k <= 5; k++) {\n      const requiredLength = k * R;\n      if (n >= requiredLength) {\n        const cycle = this.toolCallHistory.slice(-k);\n        let isPatternMatch = true;\n\n        for (let i = 0; i < requiredLength; i++) {\n          const indexFromEnd = requiredLength - i;\n          const actualKey = this.toolCallHistory[n - indexFromEnd];\n          const expectedKey = cycle[i % k];\n          if (actualKey !== expectedKey) {\n            isPatternMatch = false;\n            break;\n          }\n        }\n\n        if (isPatternMatch) {\n          return true;\n        }\n      }\n    }\n\n    return false;\n  }", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L313-L349"}, {"path": "packages/core/src/services/loopDetectionService.ts", "start": 275, "end": 309, "expect": "LLM_CHECK_AFTER_TURNS", "title": "The model-based check", "note": "Runs at the start of a turn, only after 30 turns in the same prompt, and only every `llmCheckInterval` turns.", "code": "    this.turnsInCurrentPrompt++;\n\n    if (\n      this.turnsInCurrentPrompt >= LLM_CHECK_AFTER_TURNS &&\n      this.turnsInCurrentPrompt - this.lastCheckTurn >= this.llmCheckInterval\n    ) {\n      this.lastCheckTurn = this.turnsInCurrentPrompt;\n      const { isLoop, analysis, confirmedByModel } =\n        await this.checkForLoopWithLLM(signal);\n      if (isLoop) {\n        this.loopDetected = true;\n        this.detectedCount++;\n        this.lastLoopDetail = analysis;\n        this.lastLoopType = LoopType.LLM_DETECTED_LOOP;\n\n        logLoopDetected(\n          this.context.config,\n          new LoopDetectedEvent(\n            this.lastLoopType,\n            this.promptId,\n            this.detectedCount,\n            confirmedByModel,\n            analysis,\n            LLM_CONFIDENCE_THRESHOLD,\n          ),\n        );\n\n        return {\n          count: this.detectedCount,\n          type: this.lastLoopType,\n          detail: this.lastLoopDetail,\n          confirmedByModel,\n        };\n      }\n    }", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L275-L309"}, {"path": "packages/core/src/core/client.ts", "start": 1284, "end": 1312, "expect": "_recoverFromLoop", "title": "First detection: tell the model, then carry on", "note": "The warning is sent as a new message and the turn budget is reduced by one.", "code": "  private _recoverFromLoop(\n    loopResult: { detail?: string },\n    signal: AbortSignal,\n    prompt_id: string,\n    boundedTurns: number,\n    displayContent?: PartListUnion,\n  ): AsyncGenerator<ServerGeminiStreamEvent, Turn> {\n    // Clear the detection flag so the recursive turn can proceed, but the count remains 1.\n    this.loopDetector.clearDetection();\n\n    const feedbackText = `System: Potential loop detected. Details: ${loopResult.detail || 'Repetitive patterns identified'}. Please take a step back and confirm you're making forward progress. If not, take a step back, analyze your previous actions and rethink how you're approaching the problem. Avoid repeating the same tool calls or responses without new results.`;\n\n    if (this.config.getDebugMode()) {\n      debugLogger.warn(\n        'Iterative Loop Recovery: Injecting feedback message to model.',\n      );\n    }\n\n    const feedback = [{ text: feedbackText }];\n\n    // Recursive call with feedback\n    return this.sendMessageStream(\n      feedback,\n      signal,\n      prompt_id,\n      boundedTurns - 1,\n      displayContent,\n    );\n  }", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts#L1284-L1312"}], "gotchas": ["The tool-call key is an exact hash of name and arguments [^g-key], so a call with one changed argument counts as a different call.", "The model-based check costs extra model calls, and only starts after 30 turns in one prompt [^g-llmconst].", "The double-check is skipped when the second model is unavailable: the first model's result is then enough to declare a loop [^g-unavailable].", "Loop detection can be disabled by configuration or for the rest of a session [^g-disable]."]}, {"repo": "openhands", "headline": "Four working patterns over a window of recent events", "how_it_works": ["`StuckDetector.is_stuck` looks only at events after the last user message, within a window of recent events [^o-window], so a new instruction resets the picture. It runs its checks in a fixed order [^o-scenarios].", "Four checks are implemented: the same action producing the same observation [^o-s1]; the same action followed by an error more times than the threshold [^o-s2]; consecutive agent messages with no action [^o-mono]; and an alternating action-observation pattern [^o-alt]. A fifth, for context-window errors, is a stub that always returns False [^o-stub]. The default thresholds are 4, 3, 3 and 6 [^o-thr].", "The error check counts how many times in a row the latest action has been followed by an error event; it does not compare the errors with each other [^o-streak]. When that streak is exactly 3, `get_action_error_nudge` returns a message naming the tool and the latest error, and it fires only once per error event [^o-nudge]. The conversation injects it as a user-role message [^o-run]. If the streak goes past the threshold, the conversation is stuck [^o-s2].", "When a pattern matches, the run loop's check sets the execution status to `STUCK` and returns True [^o-run]. Detection can be switched off [^o-defaults] and the thresholds overridden [^o-thrparam] when creating the conversation."], "diagram": {"caption": "A repeated error earns one nudge first [^o-nudge]; a matched pattern sets the stuck status [^o-run].", "mermaid": "flowchart TB\n  loop[\"Run loop iteration\"]:::external --> chk[\"_check_stuck_or_nudge\"]:::system\n  chk --> nudge{\"Same action errored<br/>exactly 3 times?\"}:::component\n  nudge -->|\"yes, first time\"| msg[\"Inject nudge message<br/>naming tool and error\"]:::component\n  nudge -->|\"no\"| det[\"StuckDetector.is_stuck\"]:::system\n  det --> p1[\"Same action, same result\"]:::component\n  det --> p2[\"Same action, errors\"]:::component\n  det --> p3[\"Monologue\"]:::component\n  det --> p4[\"Alternating pair\"]:::component\n  p1 --> stuck[\"Status STUCK<br/>run stops\"]:::store\n  p2 --> stuck\n  p3 --> stuck\n  p4 --> stuck\n"}, "key_parts": [{"name": "StuckDetector", "path": "openhands-sdk/openhands/sdk/conversation/stuck_detector.py", "role": "The five pattern checks and the error nudge", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/stuck_detector.py"}, {"name": "StuckDetectionThresholds", "path": "openhands-sdk/openhands/sdk/conversation/types.py", "role": "Configurable thresholds for each pattern", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/types.py"}, {"name": "_check_stuck_or_nudge", "path": "openhands-sdk/openhands/sdk/conversation/impl/local_conversation.py", "role": "Called from the run loop; injects the nudge or sets the status", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/impl/local_conversation.py"}, {"name": "ConversationExecutionStatus.STUCK", "path": "openhands-sdk/openhands/sdk/conversation/state.py", "role": "A terminal status alongside finished and error", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/state.py"}], "excerpts": [{"path": "openhands-sdk/openhands/sdk/conversation/types.py", "start": 150, "end": 161, "expect": "default=4", "title": "The thresholds", "note": "Four numbers, each overridable.", "code": "    action_observation: int = Field(\n        default=4, ge=1, description=\"Threshold for action-observation loop detection\"\n    )\n    action_error: int = Field(\n        default=3, ge=1, description=\"Threshold for action-error loop detection\"\n    )\n    monologue: int = Field(\n        default=3, ge=1, description=\"Threshold for agent monologue detection\"\n    )\n    alternating_pattern: int = Field(\n        default=6, ge=1, description=\"Threshold for alternating pattern detection\"\n    )", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/types.py#L150-L161"}, {"path": "openhands-sdk/openhands/sdk/conversation/stuck_detector.py", "start": 121, "end": 153, "expect": "scenario 5", "title": "The five scenarios, in order", "note": "Each scenario is a small method; the first match wins.", "code": "\n        # action_error needs one extra pair to tell a fresh streak from one\n        # that already continued past the nudge (see get_action_error_nudge)\n        max_needed = max(\n            self.action_observation_threshold, self.action_error_threshold + 1\n        )\n        last_actions, last_observations = self._collect_actions_and_observations(\n            events, max_needed\n        )\n\n        # Check all stuck patterns\n        # scenario 1: same action, same observation\n        if self._is_stuck_repeating_action_observation(last_actions, last_observations):\n            return True\n\n        # scenario 2: same action, errors\n        if self._is_stuck_repeating_action_error(last_actions, last_observations):\n            return True\n\n        # scenario 3: monologue\n        if self._is_stuck_monologue(events):\n            return True\n\n        # scenario 4: action, observation alternating pattern\n        if len(events) >= self.alternating_pattern_threshold:\n            if self._is_stuck_alternating_action_observation(events):\n                return True\n\n        # scenario 5: context window error loop\n        if len(events) >= 10:\n            if self._is_stuck_context_window_error(events):\n                return True\n", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/stuck_detector.py#L121-L153"}, {"path": "openhands-sdk/openhands/sdk/conversation/stuck_detector.py", "start": 156, "end": 183, "expect": "_is_stuck_repeating_action_observation", "title": "Same action, same observation", "note": "Both the actions and the observations must match, so a call that returns something new each time is not a loop.", "code": "    def _is_stuck_repeating_action_observation(\n        self, last_actions: list[Event], last_observations: list[Event]\n    ) -> bool:\n        # scenario 1: same action, same observation\n        threshold = self.action_observation_threshold\n\n        # Check for a loop of identical action-observation pairs\n        if len(last_actions) >= threshold and len(last_observations) >= threshold:\n            logger.debug(\n                f\"Found {len(last_actions)} actions and \"\n                f\"{len(last_observations)} observations, checking for equality\"\n            )\n            actions_equal = all(\n                self._event_eq(last_actions[0], action)\n                for action in last_actions[:threshold]\n            )\n            observations_equal = all(\n                self._event_eq(last_observations[0], observation)\n                for observation in last_observations[:threshold]\n            )\n            logger.debug(\n                f\"Actions equal: {actions_equal}, \"\n                f\"Observations equal: {observations_equal}\"\n            )\n\n            if actions_equal and observations_equal:\n                logger.warning(\"Action, Observation loop detected\")\n                return True", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/stuck_detector.py#L156-L183"}, {"path": "openhands-sdk/openhands/sdk/conversation/stuck_detector.py", "start": 218, "end": 248, "expect": "get_action_error_nudge", "title": "The nudge on repeated errors", "note": "It fires only when the streak equals the threshold exactly, and remembers the error event so it never fires twice for the same one.", "code": "    def get_action_error_nudge(self) -> str | None:\n        \"\"\"Nudge text once an action-error streak first hits the threshold.\n\n        Nudges once per streak: if the streak is still frozen on the same\n        error event (e.g. an empty/reasoning-only response added no new\n        action) we've already nudged for it, so we don't re-fire.\n        \"\"\"\n        events = self._events_since_last_user_message()\n        threshold = self.action_error_threshold\n        last_actions, last_observations = self._collect_actions_and_observations(\n            events, threshold + 1\n        )\n        if self._action_error_streak(last_actions, last_observations) != threshold:\n            return None\n\n        action = last_actions[0]\n        error = last_observations[0]\n        assert isinstance(action, ActionEvent)\n        assert isinstance(error, AgentErrorEvent)\n\n        if error.id == self._last_nudged_error_event_id:\n            return None\n        self._last_nudged_error_event_id = error.id\n\n        return (\n            f\"You've called `{action.tool_name}` with the same arguments \"\n            f\"{threshold} times in a row and gotten the same error each \"\n            f\"time: {error.error}. Repeating the exact same call again \"\n            \"will not work — review the error message and either correct \"\n            \"the arguments or try a different approach.\"\n        )", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/stuck_detector.py#L218-L248"}, {"path": "openhands-sdk/openhands/sdk/conversation/impl/local_conversation.py", "start": 744, "end": 767, "expect": "_check_stuck_or_nudge", "title": "How the run loop uses it", "note": "Nudge first; only if no nudge is due does it test for a stuck state.", "code": "    def _check_stuck_or_nudge(self) -> bool:\n        \"\"\"Nudge once on a repeating action-error streak, else apply is_stuck().\n\n        Returns True if STUCK was set and the run loop should stop.\n        \"\"\"\n        if not self._stuck_detector:\n            return False\n\n        nudge = self._stuck_detector.get_action_error_nudge()\n        if nudge is not None:\n            self._on_event(\n                MessageEvent(\n                    source=\"environment\",\n                    llm_message=Message(role=\"user\", content=[TextContent(text=nudge)]),\n                )\n            )\n            return False\n\n        if self._stuck_detector.is_stuck():\n            logger.warning(\"Stuck pattern detected.\")\n            self._state.execution_status = ConversationExecutionStatus.STUCK\n            return True\n\n        return False", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/impl/local_conversation.py#L744-L767"}], "gotchas": ["Only a window of 20 recent events is scanned [^o-window][^o-windowconst], so a loop with a long period can go unnoticed.", "The context-window error check is not implemented at this commit: it returns False [^o-stub].", "The error pattern matches any error after the same action, not the same error each time [^o-streak].", "Every implemented check is a rule over event equality or counts [^o-s1][^o-streak][^o-mono][^o-alt]; no model-based check was found in the detector."]}, {"repo": "langgraph", "headline": "A step counter, and the rest is up to you", "how_it_works": ["LangGraph runs a graph in steps. When a run starts, the loop computes a stop point: the current step plus `recursion_limit` plus 1 [^l-stop]. On each tick it checks whether the step has passed that point and, if so, sets its status to `out_of_steps` [^l-tick].", "The caller then raises `GraphRecursionError`, with a message suggesting a higher limit [^l-raise]. The default limit [^l-defaultuse] is read from an environment variable and is 10007 at this commit [^l-default].", "The prebuilt ReAct agent adds one courtesy on top. If the model asks for more tool calls with fewer than 2 steps remaining [^l-more], it replaces the response with a short message saying it needs more steps [^l-sorry]. That message has no tool calls, so the agent's routing does not go back to the tools [^l-end].", "Nothing in these paths inspects what the agent is doing: the only test is the step count [^l-tick]. If you want to notice the same tool being called repeatedly, you add that as a node or a check in your own graph."], "diagram": {"caption": "The only signal is the step count.", "mermaid": "flowchart TB\n  start[\"Run starts<br/>stop = step + recursion_limit\"]:::external --> tick[\"PregelLoop.tick\"]:::system\n  tick --> q{\"step past stop?\"}:::component\n  q -->|\"no\"| run[\"Run next tasks\"]:::component\n  run --> tick\n  q -->|\"yes\"| out[\"status = out_of_steps\"]:::queue\n  out --> err[\"GraphRecursionError\"]:::store\n  pre[\"Prebuilt ReAct agent<br/>fewer than 2 steps left\"]:::component -.->|\"ends politely first\"| bye[\"Sorry, need more steps\"]:::store\n"}, "key_parts": [{"name": "DEFAULT_RECURSION_LIMIT", "path": "libs/langgraph/langgraph/_internal/_config.py", "role": "The default step budget, overridable by environment variable", "url": "https://github.com/langchain-ai/langgraph/blob/9a0394d88b2211f299dcd69df92db3480c69ee61/libs/langgraph/langgraph/_internal/_config.py"}, {"name": "PregelLoop.tick", "path": "libs/langgraph/langgraph/pregel/_loop.py", "role": "Checks the step count on every iteration", "url": "https://github.com/langchain-ai/langgraph/blob/9a0394d88b2211f299dcd69df92db3480c69ee61/libs/langgraph/langgraph/pregel/_loop.py"}, {"name": "GraphRecursionError", "path": "libs/langgraph/langgraph/errors.py", "role": "Raised when the budget is exhausted", "url": "https://github.com/langchain-ai/langgraph/blob/9a0394d88b2211f299dcd69df92db3480c69ee61/libs/langgraph/langgraph/errors.py"}, {"name": "_are_more_steps_needed", "path": "libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py", "role": "Lets the prebuilt agent stop gracefully just before the limit", "url": "https://github.com/langchain-ai/langgraph/blob/9a0394d88b2211f299dcd69df92db3480c69ee61/libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py"}], "excerpts": [{"path": "libs/langgraph/langgraph/_internal/_config.py", "start": 32, "end": 32, "expect": "DEFAULT_RECURSION_LIMIT", "title": "The default budget", "code": "DEFAULT_RECURSION_LIMIT = int(getenv(\"LANGGRAPH_DEFAULT_RECURSION_LIMIT\", \"10007\"))", "url": "https://github.com/langchain-ai/langgraph/blob/9a0394d88b2211f299dcd69df92db3480c69ee61/libs/langgraph/langgraph/_internal/_config.py#L32-L32"}, {"path": "libs/langgraph/langgraph/pregel/_loop.py", "start": 609, "end": 619, "expect": "out_of_steps", "title": "The check, once per step", "code": "    def tick(self) -> bool:\n        \"\"\"Execute a single iteration of the Pregel loop.\n\n        Returns:\n            True if more iterations are needed.\n        \"\"\"\n\n        # check if iteration limit is reached\n        if self.step > self.stop:\n            self.status = \"out_of_steps\"\n            return False", "url": "https://github.com/langchain-ai/langgraph/blob/9a0394d88b2211f299dcd69df92db3480c69ee61/libs/langgraph/langgraph/pregel/_loop.py#L609-L619"}, {"path": "libs/langgraph/langgraph/pregel/main.py", "start": 2989, "end": 2999, "expect": "GraphRecursionError", "title": "Turning the status into an error", "code": "            # handle exit\n            if loop.status == \"out_of_steps\":\n                msg = create_error_message(\n                    message=(\n                        f\"Recursion limit of {config['recursion_limit']} reached \"\n                        \"without hitting a stop condition. You can increase the \"\n                        \"limit by setting the `recursion_limit` config key.\"\n                    ),\n                    error_code=ErrorCode.GRAPH_RECURSION_LIMIT,\n                )\n                raise GraphRecursionError(msg)", "url": "https://github.com/langchain-ai/langgraph/blob/9a0394d88b2211f299dcd69df92db3480c69ee61/libs/langgraph/langgraph/pregel/main.py#L2989-L2999"}, {"path": "libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py", "start": 620, "end": 634, "expect": "_are_more_steps_needed", "title": "The prebuilt agent's early exit", "note": "When this returns true, the agent's reply is replaced with a message saying it needs more steps.", "code": "    def _are_more_steps_needed(state: StateSchema, response: BaseMessage) -> bool:\n        has_tool_calls = isinstance(response, AIMessage) and response.tool_calls\n        all_tools_return_direct = (\n            all(call[\"name\"] in should_return_direct for call in response.tool_calls)\n            if isinstance(response, AIMessage)\n            else False\n        )\n        remaining_steps = _get_state_value(state, \"remaining_steps\", None)\n        if remaining_steps is not None:\n            if remaining_steps < 1 and all_tools_return_direct:\n                return True\n            elif remaining_steps < 2 and has_tool_calls:\n                return True\n\n        return False", "url": "https://github.com/langchain-ai/langgraph/blob/9a0394d88b2211f299dcd69df92db3480c69ee61/libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py#L620-L634"}], "gotchas": ["With a default of 10007 steps [^l-default][^l-defaultuse], the limit is a safety net against runaway graphs, not a loop detector.", "The prebuilt module's agent state classes carry deprecation markers at this commit [^l-deprecated], so check the current recommended agent constructor before copying this pattern."]}, {"repo": "codex", "headline": "No detector found: the loop trusts the model and compaction", "how_it_works": ["Codex's core turn function runs a loop. Its documentation says the model replies with function calls or an assistant message, and a function call's output is sent back in the next sampling request [^x-doc]. Follow-up is needed when the model asks for it or input is pending [^x-followup], and in that case the loop continues to its next iteration [^x-continue]. It has a branch for when none is needed [^x-exit], and breaks when the stop outcome says to stop [^x-break].", "No code was found in `codex-rs/core` that compares successive tool calls, counts repeats or caps the number of passes. The one place the code mentions an infinite loop is a comment about compaction keeping the context below the token limit [^x-comment].", "So at this layer nothing was found that judges whether the agent is making progress."], "key_parts": [{"name": "run_turn loop", "path": "codex-rs/core/src/session/turn.rs", "role": "The agent loop for one turn: sample, run tools, repeat until no follow-up is needed", "url": "https://github.com/openai/codex/blob/b172810921f89847cd310ecc496f9c901760e933/codex-rs/core/src/session/turn.rs"}], "excerpts": [{"path": "codex-rs/core/src/session/turn.rs", "start": 149, "end": 160, "expect": "runs a loop", "title": "What the loop does, in the authors' words", "code": "/// Takes initial turn input and runs a loop where, at each sampling request,\n/// the model replies with either:\n///\n/// - requested function calls\n/// - an assistant message\n///\n/// While it is possible for the model to return multiple of these items in a\n/// single sampling request, in practice, we generally one item per sampling request:\n///\n/// - If the model requests a function call, we execute it and send the output\n///   back to the model in the next sampling request.\n/// - If the model sends only an assistant message, we record it in the", "url": "https://github.com/openai/codex/blob/b172810921f89847cd310ecc496f9c901760e933/codex-rs/core/src/session/turn.rs#L149-L160"}, {"path": "codex-rs/core/src/session/turn.rs", "start": 612, "end": 613, "expect": "infinite loop", "title": "The only mention of an infinite loop", "note": "The concern addressed here is the context filling up, not repeated behaviour.", "code": "                // as long as compaction works well in getting us way below the token limit, we shouldn't worry about being in an infinite loop.\n                if should_roll_over {", "url": "https://github.com/openai/codex/blob/b172810921f89847cd310ecc496f9c901760e933/codex-rs/core/src/session/turn.rs#L612-L613"}, {"path": "codex-rs/core/src/session/turn.rs", "start": 653, "end": 654, "expect": "needs_follow_up", "title": "The branch taken when no follow-up is needed", "code": "                if !needs_follow_up {\n                    last_agent_message = sampling_request_last_agent_message;", "url": "https://github.com/openai/codex/blob/b172810921f89847cd310ecc496f9c901760e933/codex-rs/core/src/session/turn.rs#L653-L654"}], "searched": ["Searched `codex-rs/core/src` (excluding tests) for: loop detect, stuck, consecutive, identical, same command, duplicate tool, no progress, unproductive, stall. No relevant matches.", "Searched all of `codex-rs` for max_turns, max_iterations, max_tool_calls, max_steps. The only hit is a UI history constant unrelated to the agent loop.", "Read the exit conditions of the turn loop in `core/src/session/turn.rs`.", "A detector could exist outside `codex-rs/core`, for example on the server side or in the model's instructions. That was not examined."]}], "differences": [{"title": "Exact match versus judgment", "detail": "Gemini CLI and OpenHands both start with exact matching [^g-key][^o-s1], which is cheap. Only Gemini CLI adds a model as judge for loops that exact matching cannot see [^g-llmgate], and it pays for that with extra model calls."}, {"title": "Call only, or call plus result", "detail": "Gemini CLI hashes the tool call alone [^g-key]. OpenHands requires the observations to match too [^o-s1], so polling a command whose output changes is not treated as a loop."}, {"title": "Both can warn before they stop", "detail": "Gemini CLI injects a warning on the first detection [^g-recover] and stops on the second [^g-turnstart]. OpenHands nudges only for a repeated error [^o-nudge]; a matched pattern sets the stuck status [^o-run]."}, {"title": "Products detect, the framework budgets", "detail": "The two products that implement detection own the whole loop, so they can watch it. LangGraph does not know what your nodes mean, so it offers a step budget and leaves behaviour to you."}, {"title": "How long before a hard cap", "detail": "The step caps differ by two orders of magnitude: 100 turns per send in Gemini CLI [^g-maxturns][^g-cap], 500 iterations per run in OpenHands [^o-defaults], 10007 steps by default in LangGraph [^l-default][^l-defaultuse]."}], "build_your_own": ["Start with a step cap. It is one line, and it is the only protection LangGraph gives you by default.", "Add exact-match detection on tool calls: hash the name and arguments, keep a short history, and look for cycles, not only identical consecutive calls. Gemini CLI's version is under 40 lines.", "Compare results as well as calls if your agent legitimately polls. OpenHands' action-plus-observation rule avoids that false positive.", "Warn the model before stopping it. Gemini CLI does this on a first detection and OpenHands on repeated errors, and a message naming the tool and the error gives the model something to act on.", "Give 'stuck' its own status, separate from error and finished, so callers and UIs can respond differently.", "Only add a model-based check if exact matching is missing real loops, and gate it the way Gemini CLI does: after many turns, at a high confidence threshold, confirmed by a second model."], "method": {"scope": "Each repository was fetched at the commit listed above. For Gemini CLI, OpenHands and LangGraph the detection code and its call sites were read. For Codex the core turn loop's exit conditions were read and the core crate was searched for the terms listed in its section.", "limits": ["OpenHands refers to the `OpenHands/software-agent-sdk` repository, where the agent logic lives; the `OpenHands/OpenHands` repository is now the user interface.", "The Codex finding is 'not found in the core crate', not proof of absence across the whole product.", "Gemini CLI's text-repetition detector and the internals of its model-based check were read but are not quoted in full.", "Behaviour was read from source, not observed by running the agents.", "OpenHands' context-window error check is a stub at this commit, so the report counts four working patterns."]}, "citations": {"g-key": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 174, "end": 178, "claim": "A tool call's key is the SHA-256 hash of its name joined with the JSON string of its arguments.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L174-L178"}, "g-toolthr": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 29, "end": 29, "claim": "The tool-call loop threshold is 5.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L29-L29"}, "g-cycle": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 322, "end": 346, "claim": "For each cycle length from 1 to 5, a loop is reported when the last calls match that cycle repeated the threshold number of times.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L322-L346"}, "g-contentconst": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 30, "end": 31, "claim": "The content loop threshold is 10 and the content chunk size is 50.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L30-L31"}, "g-contentdoc": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 351, "end": 361, "claim": "Content loop detection hashes chunks of streamed text, detects identical chunks that appear frequently within a short distance, and is disabled inside code blocks.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L351-L361"}, "g-contentthr": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 493, "end": 502, "claim": "A chunk is only considered once it has occurred at least the content threshold number of times, and the most recent occurrences are then tested for how close together they are.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L493-L502"}, "g-events": {"repo": "gemini-cli", "path": "packages/core/src/core/client.ts", "start": 826, "end": 840, "claim": "Each stream event is passed to `addAndCheck`; a count above 1 yields `LoopDetected` and stops, and a count of exactly 1 stops for recovery unless the remaining turn budget is 1 or less.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts#L826-L840"}, "g-llmgate": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 275, "end": 283, "claim": "At the start of a turn, the model-based check runs only when the turns in the current prompt have reached `LLM_CHECK_AFTER_TURNS` and at least `llmCheckInterval` turns have passed since the last check.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L275-L283"}, "g-llmconst": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 34, "end": 42, "claim": "The model-based check includes the 20 most recent turns and is activated after 30 turns in a single prompt.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L34-L42"}, "g-interval": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 44, "end": 60, "claim": "The check interval defaults to 10 turns, with a minimum of 5 and a maximum of 15.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L44-L60"}, "g-conf": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 62, "end": 66, "claim": "The confidence threshold for the model-based check is 0.9, and the double-check model alias is `loop-detection-double-check`.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L62-L66"}, "g-history": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 568, "end": 570, "claim": "The model-based check takes the last `LLM_LOOP_CHECK_HISTORY_COUNT` entries of the client's history.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L568-L570"}, "g-below": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 625, "end": 637, "claim": "If the first model's confidence is below the threshold, the check interval is updated and no loop is reported.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L625-L637"}, "g-unavailable": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 641, "end": 651, "claim": "If the double-check model is not available, a loop is reported on the first model's result alone.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L641-L651"}, "g-double": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 653, "end": 658, "claim": "Otherwise the same contents are sent to the double-check model.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L653-L658"}, "g-confirm": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 683, "end": 695, "claim": "When the double-check model returns a result with confidence at or above the threshold, a loop is reported; when it returns a result below the threshold, the interval is updated; in every other case no loop is reported.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L683-L695"}, "g-adapt": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 733, "end": 739, "claim": "The next check interval is the minimum plus the range multiplied by one minus the confidence, so higher confidence gives a shorter interval.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L733-L739"}, "g-turnstart": {"repo": "gemini-cli", "path": "packages/core/src/core/client.ts", "start": 761, "end": 775, "claim": "At the start of a turn, a detection count above 1 yields `LoopDetected` and returns; a count of exactly 1 goes to `_recoverFromLoop`, unless the turn budget is 1 or less.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts#L761-L775"}, "g-recover": {"repo": "gemini-cli", "path": "packages/core/src/core/client.ts", "start": 1291, "end": 1311, "claim": "Recovery clears the detection flag, builds a feedback message beginning `System: Potential loop detected`, and calls `sendMessageStream` again with that message and one fewer bounded turn.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts#L1291-L1311"}, "g-maxturns": {"repo": "gemini-cli", "path": "packages/core/src/core/client.ts", "start": 79, "end": 79, "claim": "`MAX_TURNS` is 100.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/client.ts#L79-L79"}, "g-disable": {"repo": "gemini-cli", "path": "packages/core/src/services/loopDetectionService.ts", "start": 261, "end": 266, "claim": "The turn-start check returns a count of 0 when detection is disabled for the session or by configuration.", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/services/loopDetectionService.ts#L261-L266"}, "o-window": {"repo": "openhands", "path": "openhands-sdk/openhands/sdk/conversation/stuck_detector.py", "start": 66, "end": 84, "claim": "The detector reads a window of recent events limited by `MAX_EVENTS_TO_SCAN_FOR_STUCK_DETECTION` and keeps only those after the last user message.", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/stuck_detector.py#L66-L84"}, "o-windowconst": {"repo": "openhands", "path": "openhands-sdk/openhands/sdk/conversation/stuck_detector.py", "start": 19, "end": 21, "claim": "`MAX_EVENTS_TO_SCAN_FOR_STUCK_DETECTION` is 20.", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/stuck_detector.py#L19-L21"}, "o-thr": {"repo": "openhands", "path": "openhands-sdk/openhands/sdk/conversation/types.py", "start": 150, "end": 161, "claim": "The default thresholds are 4 for action-observation, 3 for action-error, 3 for monologue and 6 for the alternating pattern.", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/types.py#L150-L161"}, "o-scenarios": {"repo": "openhands", "path": "openhands-sdk/openhands/sdk/conversation/stuck_detector.py", "start": 130, "end": 153, "claim": "`is_stuck` calls five checks in order: same action and observation, same action with errors, monologue, alternating action-observation, and a context window error check.", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/stuck_detector.py#L130-L153"}, "o-s1": {"repo": "openhands", "path": "openhands-sdk/openhands/sdk/conversation/stuck_detector.py", "start": 163, "end": 183, "claim": "Scenario 1 reports stuck when the most recent threshold actions are all equal and the most recent threshold observations are all equal.", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/stuck_detector.py#L163-L183"}, "o-s2": {"repo": "openhands", "path": "openhands-sdk/openhands/sdk/conversation/stuck_detector.py", "start": 208, "end": 215, "claim": "Scenario 2 reports stuck when the action-error streak is greater than the threshold.", "url": "https://github.com/OpenHands/software-agent-sdk/blob/1b2b5c850b6a99d8b742bfe20d198d6167165ca2/openhands-sdk/openhands/sdk/conversation/stuck_detector.py#L208-L215"}, "o-nudge": {"repo": "openhands", "path": "openhands-sdk/openhands/sdk/con     if ((d.searched || []).length) {
      body.appendChild(h("h4", null, "What was searched"));
      body.appendChild(h("ul", { class: "plain" }, d.searched.map(function (g) { return h("li", null, g); })));
    }
    sec.appendChild(body);
  });

  if (hasDiffs) {
    sec = section("differences", "Differences", "Where they differ, and why", null);
    sec.appendChild(h("div", { class: "grid" }, data.differences.map(function (x) {
      return h("div", null, h("h3", null, x.title), h("p", null, x.detail));
    })));
  }

  sec = section("build", "Build your own", "If you are building your own", single ? "What this implementation suggests, in order of how early you need it." : "What these implementations suggest, in order of how early you need it.");
  sec.appendChild(h("ol", { class: "steps" }, (data.build_your_own || []).map(function (t) { return h("li", null, t); })));
  sec.style.borderBottom = "0";

  if (citeOrder.length) {
    sec = section("evidence", "Evidence", "Every claim, and the lines behind it", data.review
      ? "Each numbered statement was checked against the cited lines by a separate reviewer that did not write the report."
      : "These citations were checked to exist, but the claims have not been independently reviewed.");
    sec.appendChild(h("ol", { class: "evidence" }, citeOrder.map(function (id) {
      var c = citations[id];
      return h("li", null, h("span", null, c.claim), raw(" "), link(c.url, raw(c.path + ":" + c.start + "-" + c.end)));
    })));
  }

  var method = data.method || {};
  app.appendChild(h("footer", { id: "sources" }, h("div", null,
    h("strong", null, "Sources and limits"),
    h("ul", null, repos.map(function (r) {
      return h("li", null, link(r.url, raw(repoName(r))), raw(" at commit " + String(r.commit).slice(0, 10) + (r.commit_date ? " (" + r.commit_date + ")" : "") + (r.license ? ", " + r.license + " licence" : "")));
    })),
    method.scope ? h("p", null, method.scope) : null,
    h("ul", null, (method.limits || []).concat([
      "Code excerpts are copied by script from the pinned commits and belong to their authors under the licences above. Explanations are an independent reading of that code, not statements by the maintainers, and these projects change quickly.",
      data.review
        ? "The reviewer pass is a second AI agent with no access to the author's reasoning. It reduces errors; it does not make the page infallible. Follow a citation before relying on a claim."
        : "This is a draft build: no reviewer pass was recorded."
    ]).map(function (l) { return h("li", null, l); })),
    h("p", { class: "gen" }, "Generated with agent-anatomy, a Claude Code plugin."))));

  // ---- Diagrams ----
  var css = getComputedStyle(document.documentElement);
  function v(name) { return css.getPropertyValue(name).trim(); }
  function cls(name, key) { return "classDef " + name + " fill:" + v("--d-" + key) + ",stroke:" + v("--rule") + ",stroke-width:1.5px,color:" + v("--d-" + key + "-ink"); }
  var classDefs = "\n" + [cls("person", "ext"), cls("system", "system"), cls("component", "component"), cls("external", "ext"), cls("store", "store"), cls("queue", "queue")].join("\n") + "\n";
  function fail(canvas, msg) { canvas.insertBefore(h("p", { class: "note" }, raw(msg)), canvas.firstChild); }
  if (!canvases.length) return;
  if (!window.mermaid) {
    canvases.forEach(function (c) { fail(c[0], "Diagram renderer could not be loaded (offline?). Source shown instead."); });
    return;
  }
  window.mermaid.initialize({
    startOnLoad: false, securityLevel: "strict", theme: "base",
    themeVariables: {
      fontFamily: v("--body"), fontSize: "14px", background: "transparent",
      primaryColor: v("--d-component"), primaryTextColor: v("--d-component-ink"), primaryBorderColor: v("--rule"),
      lineColor: v("--d-line"), textColor: v("--ink"), mainBkg: v("--d-component"),
      clusterBkg: v("--d-group"), clusterBorder: v("--d-line"), titleColor: v("--ink"),
      edgeLabelBackground: v("--well"), nodeTextColor: v("--d-component-ink"),
      actorBkg: v("--d-component"), actorBorder: v("--rule"), actorTextColor: v("--d-component-ink"), actorLineColor: v("--d-line"),
      signalColor: v("--ink"), signalTextColor: v("--ink"), labelBoxBkgColor: v("--sheet"), labelBoxBorderColor: v("--d-line"),
      labelTextColor: v("--ink"), loopTextColor: v("--ink"), noteBkgColor: v("--sheet"), noteTextColor: v("--ink"), noteBorderColor: v("--d-line"),
      activationBkgColor: v("--well"), activationBorderColor: v("--d-line")
    },
    flowchart: { curve: "basis", useMaxWidth: true, padding: 14, nodeSpacing: 46, rankSpacing: 54 },
    sequence: { useMaxWidth: true, mirrorActors: false, wrap: true }
  });
  canvases.reduce(function (chain, c, i) {
    return chain.then(function () {
      var code = c[1];
      if (/^\s*(flowchart|graph)\b/.test(code)) code += classDefs;
      return window.mermaid.render("aa-diagram-" + i, code).then(function (out) {
        c[0].innerHTML = out.svg;
      }).catch(function (err) {
        fail(c[0], "This diagram could not be rendered: " + String(err && err.message || err).split("\n")[0]);
        var stray = document.getElementById("daa-diagram-" + i); if (stray) stray.remove();
      });
    });
  }, Promise.resolve());
})();
</script>
</body>
