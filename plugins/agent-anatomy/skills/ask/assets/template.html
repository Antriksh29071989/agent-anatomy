<style>

    --hero: #070c17; --hero-2: #0e172b;
    --ok: #5fd39a; --ok-soft: #12301f; --warn: #f0b458; --warn-soft: #33260e; --spec: #b3a1ff; --spec-soft: #241d44;
    --none: #a3acba; --none-soft: #222a38;

    --d-person: #9bcbff; --d-system: #3d8fe6; --d-component: #1f4f86; --d-ext: #4a5568; --d-store: #2a9d68; --d-queue: #c98a2b;

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

.hero { background:
    linear-gradient(var(--hero-line) 1px, transparent 1px) 0 0 / 100% 32px,
    linear-gradient(90deg, var(--hero-line) 1px, transparent 1px) 0 0 / 32px 100%,
    radial-gradient(1200px 500px at 15% -10%, #17366b 0%, transparent 60%),

  color: var(--hero-ink); padding: 56px 0 44px; }
.kicker { font: 600 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: #7fb7ff; margin: 0 0 18px; }
.hero h1 { font-size: clamp(30px, 5vw, 50px); line-height: 1.1; letter-spacing: -.025em; margin: 0 0 20px; font-weight: 700; max-width: 20em; text-wrap: balance; }
.answer { font-size: 18px; max-width: 50em; margin: 0 0 28px; padding-left: 16px; border-left: 3px solid #4d9bf0; }

.repos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px; background: var(--hero-line); border: 1px solid var(--hero-line); border-radius: 10px; overflow: hidden; }
.repo { background: rgba(10,17,32,.72); padding: 14px 16px; color: inherit; display: block; }
.repo:hover { text-decoration: none; background: rgba(20,32,58,.8); }
.repo b { display: block; font: 600 19px/1.25 var(--sans); }
.repo span { font: 11px/1.5 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--hero-muted); display: block; }
.meta { margin-top: 18px; font: 12px/1.6 var(--mono); color: var(--hero-muted); }

.tablewrap { overflow-x: auto; padding: 0; }

.dive .lead { font-size: 17px; color: var(--ink); }
.canvas { padding: 20px 12px; overflow-x: auto; text-align: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
.canvas svg { max-width: 100%; height: auto; }
.canvas svg .edgeLabel, .canvas svg .edgeLabel p, .canvas svg .edgeLabel span { color: var(--ink) !important; fill: var(--ink) !important; background-color: var(--surface-2) !important; font-size: 12.5px; }

.canvas pre { text-align: left; font: 12.5px/1.5 var(--mono); color: var(--muted); margin: 0; white-space: pre-wrap; }
.note { font: 12.5px/1.5 var(--mono); color: var(--warn); margin: 0 0 10px; text-align: left; }
.caption { color: var(--muted); font-size: 14px; margin: 8px 0 0; }

.excerpt { border: 1px solid var(--code-line); border-radius: 10px; overflow: hidden; margin: 0 0 18px; background: var(--code-bg); }
.excerpt header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--code-line); }
.excerpt header b { color: #f1f6fd; font-size: 14.5px; }
.excerpt header a, .excerpt header span { font: 12px/1.4 var(--mono); color: #8fbdf5; overflow-wrap: anywhere; }
.excerpt pre { margin: 0; padding: 12px 0; overflow-x: auto; font: 12.5px/1.6 var(--mono); color: var(--code-ink); tab-size: 2; }
.excerpt .ln { display: block; padding: 0 16px 0 0; white-space: pre; }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid .card { margin: 0; }
.grid .card p { color: var(--muted); margin: 0; }
.steps { counter-reset: t; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: t; position: relative; padding: 14px 0 14px 46px; border-bottom: 1px solid var(--line); font-size: 17px; }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(t, decimal-leading-zero); position: absolute; left: 0; top: 17px; font: 600 13px var(--mono); color: var(--accent); }
footer { margin-top: 56px; padding: 28px 0 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; }
footer ul { padding-left: 18px; margin: 8px 0 14px; }
footer .gen { font: 12px var(--mono); }
@media print { nav { display: none; } .card, .excerpt { break-inside: avoid; } }

  }
  function section(id, n, title, sub) {
    var s = h("section", { id: id }, h("div", { class: "wrap" },

    app.appendChild(s);

      var u = safeUrl(r.url);

    })),
    h("p", { class: "meta" }, raw("analysed " + (meta.analysed_at || "") + " · each repository pinned to one commit, listed at the end"))
  )));

  var single = repos.length === 1, hasDiffs = (data.differences || []).length > 0;
  var links = [["compare", single ? "At a glance" : "Side by side"]].concat(repos.map(function (r) { return ["dive-" + r.id, r.id]; }), hasDiffs ? [["differences", "Differences"]] : [], [["build", "Build your own"]]);
  app.appendChild(h("nav", null, h("div", { class: "wrap" }, links.map(function (l) { return h("a", { href: "#" + l[0] }, raw(l[1])); }))));
  var n = 0; function next() { n += 1; return (n < 10 ? "0" : "") + n; }

  sec.appendChild(h("div", { class: "card tablewrap" }, h("table", null,
    h("thead", null, h("tr", null, h("th", null, ""), (comp.dimensions || []).map(function (d) { return h("th", null, raw(d)); }))),
    h("tbody", null, (comp.rows || []).map(function (row) {

    })))));

        h("div", { class: "tags" }, h("span", { class: "tag " + r.verdict }, raw(VERDICT[r.verdict] || "")),
          h("span", { class: "tag plain" }, raw(r.kind || "")), r.license ? h("span", { class: "tag plain" }, raw(r.license)) : null),
        h("h3", null, d.headline)),

      var canvas = h("div", { class: "canvas" }, h("pre", null, raw(d.diagram.mermaid)));
      canvases.push([canvas, d.diagram.mermaid]);
      body.appendChild(h("h4", null, "The flow"));
      body.appendChild(canvas);
      if (d.diagram.caption) body.appendChild(h("p", { class: "caption" }, d.diagram.caption));
    }
    if ((d.key_parts || []).length) {
      body.appendChild(h("h4", null, "Key parts"));

        h("thead", null, h("tr", null, h("th", null, "Name"), h("th", null, "What it does"), h("th", null, "Where"))),

  sec.appendChild(h("div", { class: "card" }, h("ol", { class: "steps" }, (data.build_your_own || []).map(function (t) { return h("li", null, t); }))));

    })),
