  }

  var method = data.method || {};
  app.appendChild(h("footer", { id: "sources" }, h("div", null,
    h("strong", null, "Sources and limits"),
    h("ul", null, repos.map(function (r) {
      return h("li", null, link(r.url, raw(repoName(r))), raw(" at commit " + String(r.commit).slice(0, 10) + (r.commit_date ? " (" + r.commit_date + ")" : "") + (r.license ? ", " + r.license + " licence" : "")));
    })),
    method.scope ? h("p", null, method.scope) : null,
    h("ul", null, (method.limits || []).concat([
      "Code excerpts are copied by script from the pinned commits and belong to their authors under the licences above. Explanations are an independent reading of that code, not statements by the maintainers, and these projects change quickly.",
      data.review
        ? "The reviewer pass is a second AI agent with no access to the author's reasoning. It reduces errors; it does not make the page infallible. Follow a citation before relying on a claim."
        : "This is a draft build: no reviewer pass was recorded."
    ]).map(function (l) { return h("li", null, l); })),
    h("p", { class: "gen" }, "Generated with agent-anatomy, a Claude Code plugin."))));

  // ---- Diagrams ----
  var css = getComputedStyle(document.documentElement);
  function v(name) { return css.getPropertyValue(name).trim(); }
  function cls(name, key) { return "classDef " + name + " fill:" + v("--d-" + key) + ",stroke:" + v("--rule") + ",stroke-width:1.5px,color:" + v("--d-" + key + "-ink"); }
  var classDefs = "\n" + [cls("person", "ext"), cls("system", "system"), cls("component", "component"), cls("external", "ext"), cls("store", "store"), cls("queue", "queue")].join("\n") + "\n";
  function fail(canvas, msg) { canvas.insertBefore(h("p", { class: "note" }, raw(msg)), canvas.firstChild); }
  if (!canvases.length) return;
  if (!window.mermaid) {
    canvases.forEach(function (c) { fail(c[0], "Diagram renderer could not be loaded (offline?). Source shown instead."); });
    return;
  }
  window.mermaid.initialize({
    startOnLoad: false, securityLevel: "strict", theme: "base",
    themeVariables: {
      fontFamily: v("--body"), fontSize: "14px", background: "transparent",
      primaryColor: v("--d-component"), primaryTextColor: v("--d-component-ink"), primaryBorderColor: v("--rule"),
      lineColor: v("--d-line"), textColor: v("--ink"), mainBkg: v("--d-component"),
      clusterBkg: v("--d-group"), clusterBorder: v("--d-line"), titleColor: v("--ink"),
      edgeLabelBackground: v("--well"), nodeTextColor: v("--d-component-ink"),
      actorBkg: v("--d-component"), actorBorder: v("--rule"), actorTextColor: v("--d-component-ink"), actorLineColor: v("--d-line"),
      signalColor: v("--ink"), signalTextColor: v("--ink"), labelBoxBkgColor: v("--sheet"), labelBoxBorderColor: v("--d-line"),
      labelTextColor: v("--ink"), loopTextColor: v("--ink"), noteBkgColor: v("--sheet"), noteTextColor: v("--ink"), noteBorderColor: v("--d-line"),
      activationBkgColor: v("--well"), activationBorderColor: v("--d-line")
    },
    flowchart: { curve: "basis", useMaxWidth: true, padding: 14, nodeSpacing: 46, rankSpacing: 54 },
    sequence: { useMaxWidth: true, mirrorActors: false, wrap: true }
  });
  canvases.reduce(function (chain, c, i) {
    return chain.then(function () {
      var code = c[1];
      if (/^\s*(flowchart|graph)\b/.test(code)) code += classDefs;
      return window.mermaid.render("aa-diagram-" + i, code).then(function (out) {
        c[0].innerHTML = out.svg;
      }).catch(function (err) {
        fail(c[0], "This diagram could not be rendered: " + String(err && err.message || err).split("\n")[0]);
        var stray = document.getElementById("daa-diagram-" + i); if (stray) stray.remove();
      });
    });
  }, Promise.resolve());
})();
</script>
</body>
</html>
